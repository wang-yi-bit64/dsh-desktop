# cargo-deny 配置（缺陷治理计划 S3-2，2026-09-30）
#
# 守什么：555 个 crate 此前只有 dependabot 的「告警通道」，没有一处会在 CI 里
# **主动失败**的扫描。cargo-deny 补上这一层：advisories 在役、licenses 白名单。
#
# 纪律：`ignore` 的每一条都必须附理由，并与 README「Security Notes / 安全与依赖说明」
# 同源——两处说两套理由就是第二份真相。删除任何 ignore 项都必须让扫描真的变红
# （S3-2 判据：「把 ignore 项删掉一次，必须报红，证明它真的在查」）。

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0370（proc-macro-error 1.0.4 unmaintained）：经 gtk 栈
    # （glib-macros → glib 0.18.5 → gtk → tauri）传递引入，**无安全升级路径**，
    # 等 Tauri 迁移 gtk-rs 0.20+ 时随之消失。首跑（加 ignore 前）即在本机报红、
    # 加后转绿——「这条扫描真的在查」的实证（S3-2 判据）。
    "RUSTSEC-2024-0370",
    # RUSTSEC-2026-0367 / 0368 / 0369（`zip < 9.0.0`）：三条**都是解包侧**问题——
    # 解包时保留 SUID/SGID 位、符号链接目标可逃出解包目录、经符号链接套用 Unix 权限。
    # 版本约束**无法在本仓消除**：`zip 4.6.1` 由 `tauri-plugin-updater` 传递引入，
    # 其最新版 2.14.0（2026-10-14）仍声明 `zip = "^4"`（optional，由默认 feature
    # `zip` 开启）。dsh-host 自身可以把 zip 升到 9，但那只是**并存另一个版本**——
    # 告警按 lockfile 里的 4.6.1 报，升了也不会消失（2026-10-17 实测：升级后
    # `cargo tree -i zip@4.6.1` 仍指向 tauri-plugin-updater）。
    # 两条实际路径都碰不到受影响 API：
    #   ① 本仓代码零处调用 `extract(`——唯一用法是 `diagnostics_export.rs` 里的
    #      `ZipWriter` 写入，测试也只 `ZipArchive::new` + 逐条目读回；
    #   ② updater 的 `ZipArchive::extract`（`tauri-plugin-updater 2.13.0` 的
    #      `extract_zip`）仅在 `infer::archive::is_zip(bytes)` 为真时可达，而本项目
    #      `bundle.targets` 只有 `nsis`（`src-tauri/tauri.conf.json`），下发的更新物
    #      是 `*-setup.exe`，走 `extract_exe` 分支；且 `download()` 在 `install()`
    #      之前已完成 minisign 校验，解包只可能看到**已签名**的字节。
    # ⇒ 与 RUSTSEC-2024-0370 同性质：等上游改用 zip 9 后自动消失，不需要我们打补丁。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2026-0370 / 0371 / 0372（`zvariant` / `zbus_names` / `zvariant_derive`
    # 停止维护，三条均 2026-10-16 发布）：三个 crate 已被**并入 `zbus` 6.0.0**
    # （分别成为其 `wire` 模块、`names` 模块与内建 derive），故公告的 `patched = []`
    # ——不存在「修好」的版本，只有「换掉依赖」这一条路。
    # 版本约束**无法在本仓消除**：`zbus 6.0.0` 虽已发布，但引入它的两个 crate 仍
    # 声明 5.x 线——`notify-rust 4.18.2` 要求 `zbus ^5`、`tauri-plugin-single-instance`
    # 要求 `zbus ^5.9`（2026-10-18 用 crates.io sparse index 实测，非推测）。
    # 当前 lock：`zbus 5.19.0` / `zvariant 5.15.0` / `zvariant_derive 5.15.0` /
    # `zbus_names 4.3.4`，全部只经上面两个中间件、且只在 Linux 取用
    # （`notify-rust` 的 `cfg(all(unix, not(macos)))`、
    #  `tauri-plugin-single-instance` 的 `cfg(target_os = "linux")`）。
    # 性质：`informational = "unmaintained"`，**不含任何已知缺陷或安全影响**。
    # ⇒ 与 RUSTSEC-2024-0370 同性质：等上游中间件改吃 `zbus 6` 后自动消失，
    #   不需要我们打补丁，也无法靠本仓改动使其消失。
    # 首次报红时间线：main 的 `ci.yml` schedule 自 2026-10-16 起连续三次同一失败步骤
    # （run 38867521129 / 39012605462 / 39107517853），与本仓提交无关。
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # 注：Dependabot 报的 glib 0.18.5 告警（GHSA-wrw7-89jp-8q8g）在 RustSec 数据库
    # 中**无对应条目**（实测：RUSTSEC-2024-0429 与 GHSA ID 均报 not found /
    # not detected，0.18.5 不在其受影响区间）。该告警由 Dependabot 通道单独承担，
    # 处置口径见 README「安全与依赖说明」：仅 Linux、传递引入、不调用受影响 API、
    # 修复随上游 Tauri 迁移 gtk-rs 0.20+ 自动解析。
]

[licenses]
version = 2
# 本仓依赖树的许可证白名单（以实际 cargo deny check licenses 结果为准再收紧）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
# 重复版本先只告警（本仓锁了 555 个 crate，多版本在传递依赖里常见且无害；
# 什么时候升级为 deny 由 S5 的减法顺手评估，不在 S3 的范围里）。
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
