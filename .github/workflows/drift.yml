name: Drift

# 上游 DSH 版本漂移哨兵（定时任务）。
#
# ## 为什么独立成工作流、且跑真检查
#
# 本仓把 `@deepseek-ai/dsh` 的目标版本钉在 `scripts/dsh-targets.mjs`（唯一产地），
# 并在其上按通道叠加 patch-package 行级补丁。
# 上游处于灰度迭代期、**明确声明会有
# 破坏性变更**——落后越多，补丁冲突越会集中到某一次升级里一起爆发。
#
# `npm run gate -- drift` 把这件事从「升级时才发现」变成「落后了就有人叫」：
#   基准 = **上游最新 GitHub Release**（2026-10-09 / 计划 2f 由 npm dist-tag 换过来：
#   dist-tag 滞后可见，且上游出现过「tag 已动、依赖树未齐」的波次）；
#   · 落后 ≥1 个 minor / 上游进入更晚的预发布阶段（alpha → rc）→ **失败**；
#   · 上游在新补丁线上重新起预发布（patch 前进 **且** 阶段回退）→ **失败**
#     （`patch-line-behind`；定级是否该继续阻断待重算，见脚本文件头）；
#   · 同一预发布阶段内只落后补丁位/阶段内序号 → 仅提示；
#   · npm dist-tag 仍会打印，但**只作参考、不参与判定**；
#   · 取不到上游 Release → SKIP（**不等于「已核对」**）；
#     ⚠️ 例外：仓库 slug 404 是**配置缺陷**（slug 是本仓写死的常量）⇒ 判红，不 SKIP。
#
# ## 为什么不放进 ci.yml
#
# 真检查会因「上游领先于本仓」而红，而那是**待规划升级**的信号，不是「这个提交
# 有问题」。挂在每次 PR/提交上会长期制造无法通过的红灯，最后只会被人无视。
# 因此：`ci.yml` 只跑它的 **self-test**（纯逻辑，必过），真检查在这里按天跑，
# 失败时由 GitHub 的失败通知叫人——这正是「哨兵」该有的行为。
#
# ## 触发
#   · schedule：每天 03:17 UTC 一次
#   · workflow_dispatch：随时手动跑
#
# 命令行等价：gh workflow run drift.yml

on:
  schedule:
    # 非整点，避开 GitHub Actions 的整点排队高峰。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: upstream DSH drift
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # 纯逻辑自检先跑：一个写错了却静默放行的哨兵比没有哨兵更危险（清单见
      # scripts/gate-manifest.mjs；这里只点名这一条哨兵）。
      - name: Drift sentinel self-test
        run: npm run gate -- drift --self-test

      # 真检查：联网取上游最新 GitHub Release 并比对（基准见文件头）。
      # 落后到阈值即非零退出，让定时任务变红。
      # 取不到时脚本自行 SKIP（exit 0）并在日志里说明「未核对」；但 slug 404 判红（配置缺陷）。
      # GH_TOKEN 不是必需（公共仓库匿名可读），但共享 runner IP 的匿名限额很低，
      # 认证一次可避免把「被限流」误读成「上游没动静」。
      - name: Upstream drift check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gate -- drift

  # 更新通道健康（ADR-053）：每条**在役**通道的端点 version ≥ 该通道最新已发布 tag。
  # 为什么单独成 job：上游漂移与通道健康是**两台哨兵**——放同一个 job 里，前面那台
  # 红着（next 线的已知漂移）会让后面那台永远轮不到执行（2026-09-30 手动触发实测
  # 踩中）。分开后各自报告、互不遮蔽。
  # 休眠目标（机制见 ADR-056；当前无休眠目标——alpha 已由 ADR-057 复役）被脚本显式跳过并说明；
  # 全部休眠时脚本报错而不是空转通过。
  # 绿 = 在役通道的更新链路活着；红 = 某条在役通道断了，不是「这个提交有问题」。
  updater-channel:
    name: updater channel health
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          # gate update-channel（联网真检查）要读全部 v* tag 才能算出「该通道最新已发布版本」；
          # 浅克隆拿不到 tag，判据会退化成「永远通过」（release.yml 同款注释）。
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Updater channel check
        run: npm run gate -- update-channel

  # ⚠️ 这里**刻意没有** dependabot-setting 的 job（2026-10-09 加了又撤掉）。
  #    原因：该判据要读仓库设置里的 `security_and_analysis`，而 Actions 的 GITHUB_TOKEN
  #    **没有 push 身份**，这个字段根本不返回。实测两次：只给 `contents: read` ⇒ 字段缺席；
  #    再加 `security-events: read` ⇒ 仍然缺席（run 37894060540 / 37894189469）。
  #    于是那台 job 只会「每周全绿 + 日志里写未核对」——绿色的日志没人看，等于替一段并不
  #    存在的检查背书（ADR-030 的形态）。自检照常进 fast/ci/release；真检查改登记为
  #    **人工运行**（总表 manual 字段写明理由与恢复条件：配上带 push 权限的 PAT secret
  #    后可再接回来）。手动核验：npm run gate -- dependabot-setting
