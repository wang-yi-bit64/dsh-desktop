name: Drift

# 上游 DSH 版本漂移哨兵（定时任务）。
#
# ## 为什么独立成工作流、且跑真检查
#
# 本仓把 `@deepseek-ai/dsh` 的目标版本钉在 `scripts/dsh-targets.mjs`（唯一产地），
# 并在其上按通道叠加 patch-package 行级补丁。
# 上游处于灰度迭代期、**明确声明会有
# 破坏性变更**——落后越多，补丁冲突越会集中到某一次升级里一起爆发。
#
# `npm run gate -- drift` 把这件事从「升级时才发现」变成「落后了就有人叫」：
#   基准 = **上游最新 GitHub Release**（2026-10-09 / 计划 2f 由 npm dist-tag 换过来：
#   dist-tag 滞后可见，且上游出现过「tag 已动、依赖树未齐」的波次）；
#   · 落后 ≥1 个 minor / 上游进入更晚的预发布阶段（alpha → rc）→ **失败**；
#   · 上游在新补丁线上重新起预发布（patch 前进 **且** 阶段回退）→ **失败**
#     （`patch-line-behind`；定级是否该继续阻断待重算，见脚本文件头）；
#   · 同一预发布阶段内只落后补丁位/阶段内序号 → 仅提示；
#   · npm dist-tag 仍会打印，但**只作参考、不参与判定**；
#   · 取不到上游 Release → SKIP（**不等于「已核对」**）；
#     ⚠️ 例外：仓库 slug 404 是**配置缺陷**（slug 是本仓写死的常量）⇒ 判红，不 SKIP。
#
# ## 为什么不放进 ci.yml
#
# 真检查会因「上游领先于本仓」而红，而那是**待规划升级**的信号，不是「这个提交
# 有问题」。挂在每次 PR/提交上会长期制造无法通过的红灯，最后只会被人无视。
# 因此：`ci.yml` 只跑它的 **self-test**（纯逻辑，必过），真检查在这里按天跑，
# 失败时由 GitHub 的失败通知叫人——这正是「哨兵」该有的行为。
#
# ## 本工作流里的四台哨兵
#
#   · `drift`            —— 上游 DSH 版本漂移（读上游 GitHub Release）
#   · `updater-channel`  —— 每条在役通道的更新端点是否 ≥ 该通道最新已发布 tag
#   · `dependabot-scope` —— 「不存在目标目录未被 dependabot.yml 声明的 Dependabot 更新 job」
#                          （= security updates 被重新打开的**症状**；只读 Actions 运行记录，
#                            GITHUB_TOKEN 的 actions: read 就够）
#   · `dependabot-setting` —— 直读仓库设置里的安全更新开关（= **前提**；需要 admin 读权限，
#                            故用 PAT secret，见该 job 的说明）
#
# 后两台是 D13 的两条互补哨兵（2026-10-09）：一条抓**后果**（滞后但零 secret、全自动），
# 一条抓**前提**（即时但依赖一个需要人工保管的令牌）。
#
# ## 触发
#   · schedule：每天 03:17 UTC 一次
#   · workflow_dispatch：随时手动跑
#
# 命令行等价：gh workflow run drift.yml

on:
  schedule:
    # 非整点，避开 GitHub Actions 的整点排队高峰。
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: upstream DSH drift
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # 纯逻辑自检先跑：一个写错了却静默放行的哨兵比没有哨兵更危险（清单见
      # scripts/gate-manifest.mjs；这里只点名这一条哨兵）。
      - name: Drift sentinel self-test
        run: npm run gate -- drift --self-test

      # 真检查：联网取上游最新 GitHub Release 并比对（基准见文件头）。
      # 落后到阈值即非零退出，让定时任务变红。
      # 取不到时脚本自行 SKIP（exit 0）并在日志里说明「未核对」；但 slug 404 判红（配置缺陷）。
      # GH_TOKEN 不是必需（公共仓库匿名可读），但共享 runner IP 的匿名限额很低，
      # 认证一次可避免把「被限流」误读成「上游没动静」。
      - name: Upstream drift check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gate -- drift

  # 更新通道健康（ADR-053）：每条**在役**通道的端点 version ≥ 该通道最新已发布 tag。
  # 为什么单独成 job：上游漂移与通道健康是**两台哨兵**——放同一个 job 里，前面那台
  # 红着（next 线的已知漂移）会让后面那台永远轮不到执行（2026-09-30 手动触发实测
  # 踩中）。分开后各自报告、互不遮蔽。
  # 休眠目标（机制见 ADR-056；当前无休眠目标——alpha 已由 ADR-057 复役）被脚本显式跳过并说明；
  # 全部休眠时脚本报错而不是空转通过。
  # 绿 = 在役通道的更新链路活着；红 = 某条在役通道断了，不是「这个提交有问题」。
  updater-channel:
    name: updater channel health
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          # gate update-channel（联网真检查）要读全部 v* tag 才能算出「该通道最新已发布版本」；
          # 浅克隆拿不到 tag，判据会退化成「永远通过」（release.yml 同款注释）。
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Updater channel check
        run: npm run gate -- update-channel

  # Dependabot 更新 job 的**范围症状**哨兵（D13，2026-10-09）。
  #
  # 断言：基线之后不存在「目标目录未被 `dependabot.yml` 声明」的 Dependabot 更新 job。
  # 为什么这等于「安全更新没被重新打开」：`dependabot.yml` 的 `directory` 只管版本更新，
  # 安全更新按**告警的 manifest_path** 开 job、不读该文件；本仓只声明了 `/`，而历史全部
  # 11 个 job 的目标都是 `/harness-locks/*` 或 `/src-tauri` ⇒ 这类 job 只可能来自安全更新。
  # 判据与基线常量的完整理由见 scripts/verify-dependabot-scope.mjs 文件头。
  #
  # 为什么这台**能**进 CI，而下面 dependabot-setting 那台要 PAT：它读的是 Actions 运行
  # 记录，`actions: read` 就够（公开仓库连匿名都可读，实测 http=200）；而「开关状态」住在
  # 仓库设置里，任何 `GITHUB_TOKEN` 权限都读不到（Actions 的 permissions 里没有
  # administration 这一项；实测三次，见 dependabot-setting job 的说明）。
  dependabot-scope:
    name: dependabot update job scope
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    # 读 Actions 运行记录需要 actions: read。**必须逐 job 写**：顶层是 contents: read，
    # 而 job 级 permissions 会整体覆盖顶层（不是合并）。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        # 判据要读仓库内的 .github/dependabot.yml 作对照面，故必须有工作树。

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependabot scope self-test
        run: npm run gate -- dependabot-scope --self-test

      # 真检查。三个出口里 skip 是「未核对」（与「已核对且没问题」同为 exit 0），
      # 所以总表给它 echoOutput: true —— 日志必须自证这次到底核对了没有。
      - name: Dependabot scope check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gate -- dependabot-scope

  # 直读「仓库级 Dependabot security updates」开关（D13 的**前提**面）。
  #
  # 为什么它需要 PAT secret：两个来源都要求比 GITHUB_TOKEN 更强的身份 ——
  #   · `GET /repos/{owner}/{repo}/automated-security-fixes` 的规格原文是
  #     "The authenticated user must have admin read access to the repository"；
  #   · `GET /repos/{owner}/{repo}` 的 `security_and_analysis` 只对有 push 身份的调用者返回。
  # 2026-10-09 实测三次（run 37893438935 / 37894060540 / 37894189469）：只给 `contents: read`
  # ⇒ 字段缺席；再加 `security-events: read` ⇒ 仍然缺席。
  #
  # ⚠️ 所以**不要**把 GH_TOKEN 改回 secrets.GITHUB_TOKEN —— 那样这台 job 会「每周全绿 +
  #    日志里写未核对」，绿色没人看 = 替一段并不存在的检查背书（ADR-030 的形态）。
  #    secret 的创建步骤与权限要求见 docs/commands.md §20j。
  dependabot-setting:
    name: dependabot security updates switch
    runs-on: ubuntu-24.04   # 钉死：ubuntu-latest 自 2026-10-19 起滚动迁往 Ubuntu 26.04（runner-images#14748）
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        # 要用仓库内的 scripts/ 跑判据，故必须有工作树（`download-artifact` 那种只放资产的
        # 模式在这里不适用——F13 事故：publish-assets job 少了 checkout，脚本找不到）。

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # 🔴 「secret 没配」必须**在这里**变红，不能让它退化到脚本里变成一次 exit 0 的
      #    「未核对」。`${{ secrets.X }}` 在 secret 不存在时展开成**空串**，于是脚本会走
      #    skip 分支、job 全绿——正是本仓最怕的「检查悄悄停摆」。
      #    ⚠️ 不要把这个判断改写成 step 的 `if:`：GitHub 的 step 级 `if` **拿不到
      #    `secrets` 上下文**（可用上下文里没有它），写了只会恒为空/报错。
      #    令牌**配了但失效**（401/403）由脚本自己判红，见其文件头的「认证类失败」一节。
      - name: Require PAT secret
        env:
          TOKEN: ${{ secrets.DSH_REPO_ADMIN_TOKEN }}
        # 显式写 `shell: bash`：本步是 POSIX 语法（`[ -z ]`）。今天跑在 ubuntu 上默认就是
        # bash，但**将来若有人改 runs-on**，Windows 的默认 shell 是 PowerShell，这行会
        # 解析期即死——本仓的续行守卫刻意不看 runs-on，就是为这一类留的（AGENTS.md §7）。
        shell: bash
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret DSH_REPO_ADMIN_TOKEN 未配置或为空 —— 这条检查不会执行，故不得判绿。"
            echo "创建步骤与权限要求见 docs/commands.md §20j；本 job 的说明见 .github/workflows/drift.yml。"
            exit 1
          fi

      - name: Dependabot switch self-test
        run: npm run gate -- dependabot-setting --self-test

      # 真检查：两个来源并读（automated-security-fixes + security_and_analysis），
      # 「危险优先」取并集。逐来源明细在成功时也会打印（总表 echoOutput: true）。
      - name: Dependabot switch check
        env:
          GH_TOKEN: ${{ secrets.DSH_REPO_ADMIN_TOKEN }}
        run: npm run gate -- dependabot-setting

