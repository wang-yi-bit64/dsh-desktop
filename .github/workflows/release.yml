name: Release

# 触发条件（两条，二者互补）：
#   1. push tag `v*`   —— 正常路径。发布由 tag 掌控，代码合并不会误发。
#   2. workflow_dispatch —— 兜底重跑。发布失败时不必删 tag 重建（删已发布的 tag
#      是破坏性操作），指定同一个 tag 重跑即可。
#
# 为什么用「tag 触发」而不是「main 触发」：
#   发布是**一次性、不可撤销**的动作（GitHub Release 一旦公开就有人下载）。
#   tag 是一个显式的、单一的意图声明；而 main 上的每次提交都自动发版会让
#   「发布」退化成一个无需决策的背景动作。
#
# 与 ci.yml 的分工边界（**2026-09-11 调整后重述，别再用旧口径读**）：
#   - 本工作流**不重跑** cargo test / clippy / 三平台烟雾矩阵。它只跑 preflight 的
#     秒级静态门禁，目的是**在组装 300MB 资源之前**失败，避免三平台各白跑一轮。
#   - ⚠️ 同日起 ci.yml **不再随 `push main` 触发**（日常提交零自动化）。因此
#     「tag 指向的提交早已通过三平台门禁」这个前提**不再自动成立**：本工作流现在
#     是 tag 上唯一会出包、也是唯一会拦一道门的地方。
#   - 残留风险（有意接受，不是遗漏）：给一个从未跑过 `cargo test` / clippy / 三平台
#     烟雾的提交打 tag，本工作流**不会**发现——preflight 的静态门禁看不见运行时行为。
#     发布前的正确做法：先在 Actions 手动 dispatch 一次 **CI** 工作流
#     （`.github/workflows/ci.yml`，带完整 test + smoke + build）并确认全绿，再打 tag。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（须已存在，形如 v0.1.0）'
        required: true
        type: string

# 发布不可中途取消：半途取消会留下一个缺产物的 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# contents: write 是创建 Release 与上传资产所必需。
permissions:
  contents: write

jobs:
  preflight:
    name: preflight / 版本与 tag 一致性
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dsh_target: ${{ steps.resolve.outputs.dsh_target }}
      dsh_version: ${{ steps.resolve.outputs.dsh_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 —— 生成变更说明需要「上一个 tag..本 tag」的完整区间，
          # 浅克隆拿不到 tag 与历史（GitHub 默认只取 1 个提交、不含 tag）。
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # 解析 tag → 版本 → 是否预发布 → **该组装哪条 DSH 通道**。四者都要用，
      # 集中在一处产出，避免每个 job 各写一遍推导逻辑（那必然出现某一处漏改）。
      #
      # `dsh_target` 由**版本号的预发布后缀**决定（`0.6.0-alpha.1` → alpha 线、
      # `0.7.0-rc.1` → next 线），与 `scripts/dsh-targets.mjs` 的总表同源。
      #
      # 🔴 后缀是**本仓的命名**（`publishChannel`），不等于上游 npm dist-tag 名：
      #    `next` 目标跟踪的上游 tag 是 `next`，而它的桌面后缀是 `rc`
      #    （上游 `next` dist-tag 当下就指向一个 `rc` 阶段版本）。两者独立，
      #    所以这里用 `--channel-of` 查的是 publishChannel，而漂移哨兵查的是 channel。
      # 未知后缀（如 `beta`）**直接失败**，不回退默认目标——静默回退会产出
      # 「版本号说 beta、运行时却是 next 线」的包，而用户要装上才发现。
      - name: Resolve tag, version, prerelease flag and DSH target
        id: resolve
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # semver 含 `-` 后缀即预发布（如 0.2.0-beta.1）。用 node 判定而不是
          # shell 的字符串包含：`0.2.0` 里没有任何 `-`，但未来出现 `1.0.0+build-5`
          # 这类 build metadata 时，字符串判断会把正式版误判成预发布。
          PRE=$(node -e '
            const v = process.argv[1];
            const m = /^\d+\.\d+\.\d+(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(v);
            if (!m) { console.error(`非法 semver: ${v}`); process.exit(1); }
            console.log(m[1] ? "true" : "false");
          ' "$VERSION")
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          # 通道 → 构建目标；未知通道以非零退出（node 脚本自己报错）。
          DSH_TARGET="$(node scripts/dsh-targets.mjs --channel-of "$VERSION")"
          echo "dsh_target=$DSH_TARGET" >> "$GITHUB_OUTPUT"
          # 目标 → 该目标固定的上游版本。发布正文要用它声明「本版内置哪个运行时」：
          # 双通道下这是用户选版本时最先看的信息，而变更日志的提交区间**不保证**提到
          # 它（alpha 线的区间常常只有版本提交一条，正文会近乎空白）。
          DSH_VERSION="$(node scripts/dsh-targets.mjs --version-of "$DSH_TARGET")"
          echo "dsh_version=$DSH_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION prerelease=$PRE dsh_target=$DSH_TARGET dsh_version=$DSH_VERSION"

      # 版本号三处（package.json / tauri.conf.json / Cargo.toml）一致性 + tag 匹配。
      # 这条是发布链路最关键的防线：tag 与版本号不一致时，打出来的包会自称另一个
      # 版本，而 updater 的版本比较据此决定推不推更新——错一次就会让所有已安装
      # 用户收到「版本号没变」的更新，或永远收不到更新。
      - name: Verify version consistency against the tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/version.mjs check --tag "$TAG"

      # 秒级静态门禁：确认这个 commit 的契约面是自洽的（命令面、页面按钮接线、
      # 补丁分级）。与 ci.yml 用同一套脚本，不是另一套判断标准。
      - name: Fast static gates
        run: |
          npm run verify:patches
          npm run verify:prune
          npm run verify:variants
          npm run verify:harness-lockfile
          npm run verify:remove-tree
          npm run verify:release-workflow
          npm run verify:release-assets
          npm run verify:release-assets:self-test
          npm run verify:cli-package
          npm run verify:profile-names
          npm run verify:drift:self-test
          npm run verify:claims
          npm run verify:ipc-surface
          npm run verify:ipc-surface:self-test
          npm run verify:shell-pages
          npm run verify:harness-inject
          npm run verify:harness-entry
          npm run verify:commits
          npm run verify:changelog

      # 发布前**必须**知道自己在发布哪个上游基线。这里跑真检查（联网）但**不阻断**
      # 发布：落后上游是「该规划升级了」，不是「这次发布有问题」——把提醒打在日志里，
      # 由人判断是否在本次发布前推进（推进流程见 docs/dsh-upgrade-checklist.md）。
      - name: Upstream drift check (informational)
        continue-on-error: true
        run: npm run verify:drift

  build:
    name: ${{ matrix.os }} / release
    needs: preflight
    runs-on: ${{ matrix.os }}
    env:
      DSH_TARGET: ${{ needs.preflight.outputs.dsh_target }}
    strategy:
      fail-fast: false
      # 每个平台显式指定 bundle 类型。**不能**依赖 tauri.conf.json 的
      # `bundle.targets`：那里只写了 `nsis`（Windows 专属），在 macOS/Linux 上
      # 会因「目标类型不属于该平台」而失败。
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # 用了反斜杠续行就必须显式声明 bash——判据见 verify-release-workflow.mjs
        # 的 shell 可移植性守卫（PowerShell 的续行符是反引号，`\` 会被当成自减运算符）。
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            librsvg2-common \
            libgdk-pixbuf2.0-bin \
            patchelf
          # AppImage 打包专用：linuxdeploy 的 gtk 插件需要 pixbuf loaders 且缓存
          # 已刷新，否则 `failed to run linuxdeploy`（详见 ci.yml 同名步骤注释）。
          # noble 的 gdk-pixbuf-query-loaders 不在 PATH，用 multiarch 绝对路径兜底。
          /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache || true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install build tooling
        run: npm ci

      # 打包目标守卫：prepare:harness 会把**当前主机架构**的 Node 运行时装进
      # 资源树；架构不一致的包在目标机上表现为「Harness 起不来」，根因在构建期。
      # 放在组装 300MB 之前失败。
      - name: Verify packaging target
        run: npm run verify:target

      # 预检签名密钥：默认配置的 `createUpdaterArtifacts: true` 要求签名密钥，缺了会在
      # **打包末尾**才失败。⚠️ 必须放在组装之前——它原先紧挨着 build 步骤，于是
      # 「缺密钥」这个几秒就能查明的前提，要等 300MB 组装 + 一整轮 Rust 编译跑完
      # 才暴露（2026-09-22 portable job 就是这样白跑 13m58s）。
      # 用 env 传值而不是把 `${{ secrets.* }}` 插进 run 字符串——后者一旦被回显
      # 就会把私钥写进构建日志。
      - name: Verify signing key is available
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set - updater artifacts cannot be signed. See README (Auto-update)."
            exit 1
          fi

      # 内置哪条上游运行时通道由 tag 决定（见 preflight）：`0.5.0-next.1` 组装
      # next 线（DSH rc）、`0.6.0-alpha.1` 组装 alpha 线。版本号与运行时因此
      # 天然一致，不需要在 tag 之外再声明一次通道。
      #
      # 用 env 传目标名，**不要**写成 `--dsh-target="${DSH_TARGET}"`：Windows
      # runner 的默认 shell 是 PowerShell，那次写法把值丢掉（参数退化成
      # `--dsh-target=`），只有 Windows 的 Smoke job 红，macOS/Linux 正常——
      # 三个平台给出相反结论，根因却只是 shell 不同。
      - name: Prepare harness resources
        run: npm run prepare:harness

      # 组装树健全性（与 ci.yml 的 bundle job 同一套规则，发布前再拦一次）。
      - name: Verify assembled harness tree
        run: npm run verify:harness-tree

      - name: Verify bundled Node.js version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/resources/node/node.exe --version
          else
            ./src-tauri/resources/node/node --version
          fi

      # 生成变更说明。三个平台各自生成（内容由 tag 区间唯一决定，必然一致），
      # 避免用 job outputs 跨 job 传多行字符串这种脆弱做法。
      # 上一个 tag 的取法：`<tag>^` 上找最近 tag；找不到（首次发布）则从头读。
      - name: Build release notes from commit history
        id: notes
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          DSH_VERSION: ${{ needs.preflight.outputs.dsh_version }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            # 运行时基线横幅：双通道下，「这一版内置哪个 DSH」是用户选版本时最先看的
            # 信息，而变更日志的提交区间**不保证**提到它——alpha 线的区间常常只有
            # 版本提交一条，正文会近乎空白。用 preflight 推导出的值显式声明，不靠
            # 提交历史碰巧写对。
            echo "> 内置运行时：**DSH \`${DSH_VERSION}\`**（\`${DSH_TARGET}\` 通道）"$'\n'
            # 变量一律用 ${VAR} 花括号形式：macOS runner 的 bash 3.2 在无 UTF-8
            # locale 时，不会把紧跟其后的全角标点当作变量名的终止符——`$TAG）`
            # 会被解析成变量 `TAG）`，报 `TAG）: unbound variable`（Linux/Windows
            # 的 bash 则正确终止）。这是发布链路只在 macOS 上失败过的根因。
            if [ -n "$PREV" ]; then
              echo "**完整变更**：\`${PREV}\` → \`${TAG}\`"$'\n'
              node scripts/changelog.mjs --notes --from "$PREV" --to "$TAG"
            else
              echo "**首次发布**（${TAG}）"$'\n'
              node scripts/changelog.mjs --notes --to "$TAG"
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # tauri binary-releases 里的 linuxdeploy 是 2021 年的旧 continuous 构建，
      # 新 glibc 下有多种兼容问题；tauri 对 ~/.cache/tauri 下已存在的工具
      # 不重新下载，预置官方新版 pin 住（详见 ci.yml 同名步骤注释）。
      - name: Pin recent linuxdeploy (Linux AppImage)
        if: runner.os == 'Linux'
        # 用了反斜杠续行就必须显式声明 bash（同上）。
        shell: bash
        run: |
          mkdir -p ~/.cache/tauri
          curl -fL --retry 3 -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      # tauri-action 负责：跑 `tauri build`、创建/更新 Release、上传安装包与
      # `.sig` 签名、并生成 updater 的 `latest.json`（uploadUpdaterJson 默认开）。
      # `latest.json` 是自动更新的关键——updater 端点指向
      # `releases/latest/download/latest.json`，缺了它更新链路就断。
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ubuntu 24.04+ 的 .relr.dyn 段令 linuxdeploy 的旧 strip 失败 →
          # `failed to run linuxdeploy`；NO_STRIP=1 为官方 workaround
          # （详见 ci.yml Build installers 步骤注释）。
          NO_STRIP: "1"
        with:
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: 'DSH Desktop ${{ needs.preflight.outputs.version }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          releaseCommitish: ${{ github.sha }}
          # tauri-action **自己**会在 tauriScript 之后插入 `build` 子命令和一个
          # `--` 分隔符（src/runner.ts：args = tauriScript + ['build'] + ['--'] + args），
          # 因此：
          #   · tauriScript 不能再带尾随 `--`，也不要包含 `build`；
          #   · args 只放 `tauri build` 的**选项**，不要把 `build` 写进去。
          # 踩过的坑（2026-09-11，三平台 release 全红）：写成
          # `tauriScript: npm run tauri --` + `args: build --bundles …`，
          # 实际展开为 `npm run tauri -- build -- build --bundles …`，tauri CLI 报
          # `unexpected argument 'build' found`。正确展开应为
          # `npm run tauri build -- --bundles …`。
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }} -v
          # ⚠️ 这里**不要**写 `uploadWorkflowArtifacts`：tauri-action（`@v0`）没有这个
          # 输入，GitHub 只会打一条 "Unexpected input(s)" 警告并**静默忽略**它
          # （2026-09-22 核对其 action.yml：与工件相关的输入只有 `uploadPlainBinary`，
          # 而那是「把裸二进制传到 Release」，不是工作流工件）。原注释据此声称
          # 「安装包也能从 Actions 页面取回」，是**不成立的宣称**，故一并删除。
          # 真正的取回通道：安装包由本 action 直接挂到 Release assets；Release 环节
          # 出问题时用 workflow_dispatch 指定同一 tag 重跑——这正是本工作流保留
          # dispatch 触发的原因。
          retryAttempts: 2

      - name: Report bundle size
        if: always()
        run: node scripts/report-bundle-size.mjs --markdown

      # 补丁健康度写进 job summary（组装后 MANIFEST.json 才有逐条证据）。
      # 报告不作门禁——补丁失败的分级策略已由 prepare:harness 执行。
      - name: Report patch health
        if: always()
        run: npm run report:patches -- --markdown

  # ---------------------------------------------------------------------------
  # 便携版（Windows zip）：与 NSIS 安装版并行构建，互不干扰。
  # ---------------------------------------------------------------------------
  # 为什么单独成 job 而不是复用 build matrix：
  #   · 它做的是「先真 build 一次默认配置的 app，再把原始 app 目录重新打成一个
  #     便携 zip」，输入与判据都与 build matrix 的「按平台出安装包」不同；
  #   · 便携版是 Windows 独占需求，其他平台不需要它。
  #
  # ⚠️ 它走的是**默认配置**（`--bundles nsis`），没有独立的便携版配置：
  #   `package-portable.mjs` 的必需输入 `WebView2Loader.dll` 由 tauri-bundler
  #   **打包后**才落到 `target/release/` 根目录（缺它便携包启动即 0xC0000135 静默
  #   崩溃），因此这一步必须真的 bundle 一次，不能换成 `--no-bundle`。
  #   历史上存在过一个孤置的 `src-tauri/tauri.portable.conf.json`：它的
  #   `bundle.resources` 与 `tauri.conf.json` **逐条相同**，只多出 `targets:["zip"]`
  #   与 `createUpdaterArtifacts:false`，且**从未被任何工作流或脚本引用**——
  #   已于 2026-09-22 删除。它当初想省掉的签名私钥，现由下面「显式传密钥」承担。
  #
  # ⚠️ 默认配置里 `bundle.createUpdaterArtifacts: true` 因此同样作用于本 job：
  #   缺签名私钥会在**打包末尾**报 `A public key has been found, but no private key`，
  #   白跑一整轮编译——2026-09-22 v0.7.0-alpha.3 的真实事故（13m58s 后才失败）。
  #   与 build job 一样传密钥，并把校验**前置到组装之前**，让缺密钥在秒级失败。
  portable:
    name: windows / portable zip
    needs: preflight
    runs-on: windows-latest
    env:
      DSH_TARGET: ${{ needs.preflight.outputs.dsh_target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install build tooling
        run: npm ci

      # 预检签名密钥：默认配置的 `createUpdaterArtifacts: true` 要求签名密钥，缺了会在
      # **打包末尾**才失败（见 job 头注释）。放在组装 300MB 之前，秒级暴露——别等
      # 一整轮编译跑完才发现前提不成立。用 env 传值而不是把 `${{ secrets.* }}`
      # 插进 run 字符串——后者一旦被回显就会把私钥写进构建日志。
      - name: Verify signing key is available
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set - the default config sets bundle.createUpdaterArtifacts, so tauri build cannot bundle. See README (Auto-update)."
            exit 1
          fi

      - name: Prepare harness resources
        run: npm run prepare:harness

      - name: Verify assembled harness tree
        run: npm run verify:harness-tree

      - name: Build portable app bundle
        # 用默认配置构建（产出可运行的原始 app 目录 + NSIS installer）。便携版只取
        # `target/release/` 的原始 app 目录，但**必须**真的 bundle 一次才能拿到
        # tauri-bundler 落下的 `WebView2Loader.dll`（见 job 头注释）。
        # 不用 Tauri 的 `zip` bundle target：该目标在当前 CLI 版本上不受 Windows 支持。
        # 密钥是默认配置的硬要求——便携包自身不带 updater，但默认配置会签名，缺了就报错。
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis -v

      - name: Package portable artifact
        # ⚠️ `shell: bash` 是**必须的**，不是风格偏好。
        #   本步的命令用 POSIX 反斜杠续行（`\`），而 windows-latest 的默认 shell 是
        #   PowerShell——PowerShell 的续行符是反引号，`\` 不是续行符，于是第 2 行开头的
        #   `--bundle-dir` 被当成**自减运算符**，整段脚本在解析阶段就死：
        #     ParserError: ... Missing expression after unary operator '--'.
        #   2026-09-22 v0.7.0-alpha.4 的真实事故：portable job 编译了 13m40s，
        #   最后死在打包这一步的第 1 秒，且 cli-publish 因 needs 被跳过——
        #   所有 CLI 产物白构建（三个平台的成功产物一个都没上传）。
        #   之前一直没暴露，是因为更早的失败（缺签名私钥）总在编译前/中就拦住了，
        #   这一步**从未被执行过**。本仓其余多行 bash 步骤都写了 `shell: bash`，
        #   只有此处漏了；`npm run verify:release-workflow` 已加静态守卫防止复发。
        env:
          DSH_VERSION: ${{ needs.preflight.outputs.dsh_version }}
        shell: bash
        run: |
          node scripts/package-portable.mjs \
            --bundle-dir target/release \
            --out dist/portable \
            --version "${{ needs.preflight.outputs.version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: portable-windows
          path: dist/portable/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 把便携版挂到 Release 上（F13 修复，2026-09-24）
  # ---------------------------------------------------------------------------
  # ## 为什么需要这个 job
  #
  # `build` job 用 tauri-action，它**自带**上传能力（9 个平台安装包 + `.sig`
  # + `latest.json`）。而 `portable` job 只把 zip/.sha256/manifest 传到了
  # **Actions workflow artifacts** 里——那是 Actions 页面上的临时产物，
  # **不是 Release 资产**。于是 AGENTS.md §8.5 声明的「期望资产 13」实际只能
  # 兑现 10：3 个便携版停在 artifacts 里，用户从 Releases 页面下载不到。
  #
  # 根因不是「忘了调一次上传」：这一步原本属于已退役的 `cli-publish` job
  # （它做「下载 artifact → 核验 → `gh release upload` → 写正文」四件事），
  # 删那个 job 时只数了它的 CLI 职责，便携版的这半截**从来没被搬过来**。
  # 与「插件隔离」同族：删一个 job 前先数它承载几类职责。
  #
  # ## 为什么是独立 job 而不是塞进 portable
  #
  # 1. **Release 对象由 `build` 的 tauri-action 创建**（`releaseDraft: false`），
  #    所以上传必须 `needs: build`——而 `portable` 只 `needs: preflight`，
  #    两者并行。塞进 `portable` 就必须让 portable 也等 build，白白拖长关键路径。
  # 2. 这里后续还要承接 R1 的「三平台 `patchSetHash` 汇总」（那也需要一个
  #    `needs: [build, portable]` 的落点）。两处汇总同址 = 一处真相。
  #
  # ## 为什么用 `gh release upload` 而不是别的 action
  #
  # `softprops/action-gh-release` 之流会**自己创建 Release**，与 tauri-action
  # 抢同一个对象（`--clobber` 语义不明）。`gh release upload` 只**追加资产**到
  # 已存在的 Release，语义最窄、副作用最小。
  #
  # ⚠️ 该动作受 `verify-release-workflow` 的守卫约束，且是**按宾语**判的：
  #    上传 `dist/portable/*` 放行，上传 `dist/cli/*` 判红（CLI 退役断言不得放宽）。
  publish-assets:
    name: attach portable assets to the release
    needs: [preflight, build, portable]
    runs-on: ubuntu-latest
    steps:
      # ⚠️ artifact 名要与 `portable` job 里 `upload-artifact` 的 `name` 逐字一致。
      #    改一处必须改另一处——守卫不查这个（跨 job 的字符串相等性静态判不了），
      #    真正的防线是发布后按资产清单核对（13 项）。
      - uses: actions/download-artifact@v5
        with:
          name: portable-windows
          path: dist/portable

      - name: Verify downloaded portable assets
        # 核验必须先于上传：`package-portable.mjs --verify-download` 会核对
        # `.sha256` 边车与实际字节是否一致，并**解包**复检运行时树与旁挂依赖
        # （`WebView2Loader.dll` 缺失即启动 0xC0000135）。少了这一步，就是把
        # 「产物未经核验就上架」——比不做更糟（用户会以为它被验过）。
        #
        # ⚠️ 参数是**位置式**的：`--verify-download <目录>` + `--manifest <文件>`，
        #    没有 `--dir`。基线名由版本号推导（`portableBaseName`），故两者都要
        #    显式给全，别指望默认值。
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist/portable
          VERSION="${{ needs.preflight.outputs.version }}"
          node scripts/package-portable.mjs \
            --verify-download dist/portable \
            --manifest "dist/portable/DSH-Desktop-${VERSION}-portable.manifest.json"

      - name: Upload portable assets to the release
        # ⚠️ `shell: bash` 是必须的：本步用了 POSIX 反斜杠续行，而 ubuntu-latest
        #    的默认 shell 恰好就是 bash——但守卫（shellContinuationProblems）刻意
        #    **不看 `runs-on`**，只认「有续行就必须显式声明」。别因为「这里是
        #    Linux」就省掉它：以后谁把 runs-on 改掉，缺陷只在 Windows 现形。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          # `${VAR}` 花括号形式是硬要求：macOS 的 bash 3.2 在无 UTF-8 locale 时
          # 不把紧邻的全角标点当变量名终止符（release.yml:264 附近有同样注释）。
          gh release upload "${TAG}" dist/portable/* --clobber
          echo "已把便携版资产挂到 Release ${TAG}"

  # ---------------------------------------------------------------------------
  # 🗄️ CLI 发布通道 — 已退役（2026-09-24），**不要加回来**
  # ---------------------------------------------------------------------------
  # 此处原有 `cli`（三平台构建 + 打包 + upload-artifact）与 `cli-publish`
  # （下载核验 → gh release upload → 写 Release 正文）两个 job。
  #
  # ## 为什么删
  #
  # 1. **零外部消费者**。三个消费者全部在仓库内，且全部使用 `target/debug/` 的
  #    本地构建，与上传产物**零交集**：`scripts/smoke-launch.mjs`（L1/L2 冒烟）、
  #    `scripts/fault-inject.mjs`（三平台孤儿清理硬门禁）、
  #    `crates/dsh-host-cli/tests/cli_blackbox.rs`。
  # 2. **产物不自足**。归档**不含 runtime**（ADR-045 的硬边界），`start` 必然退出
  #    码 3；对已装桌面的用户无增量价值（他们的 `resources/` 就在安装目录里），
  #    对第三方又跑不起来。定位与产物形状错位 = 「可引用」名不副实。
  # 3. **定位不依赖产物**。INV-6（无 GUI 核心库）靠「存在一个能跑二进制的入口」
  #    兑现，不靠「二进制挂在 Release 上」。
  #
  # 逐条实测见 `docs/dev-plan-cli-distribution.md` §5；决策记录见 ADR-045 的
  # 「后续」段与 ADR-047「从发布产品到能力证明资产」。
  #
  # ## 什么被保留了（退役的是发布，不是能力）
  #
  # · `crates/dsh-host-cli` —— INV-6 的兑现载体，两个门禁的依赖。**删不得。**
  # · `scripts/package-cli.mjs`（857 行）—— 其约 40 项判据（归档丢可执行位、
  #   边车格式 `sha256sum -c` 读不读得动、篡改能否判红）与「要不要上传」无关，
  #   属于 ADR-031 的可证伪守卫资产。仍由 `preflight` 的
  #   `npm run verify:cli-package` 在每次发布前跑（秒级，早于组装 300MB）。
  # · 归档格式：`dist/cli/` 的**本地**打包能力，供需要时手动产出。
  #
  # ## 什么被归档了
  #
  # · `scripts/dry-run-cli-publish.mjs`（813 行）—— 它 100% 服务于「上传步骤正确性」
  #   这一个目标，上传取消后失去唯一标的。移入 `docs/archive/`。
  #
  # ## 历史资产未删
  #
  # 已发布 Release 上的 9 个 CLI 资产（v0.4.0 ~ v0.7.0-alpha.7）**保持原样**：
  # 它们可下载、可核对、链接有效，删除反而破坏历史可追溯性，且 GitHub 上删资产
  # **不可逆**（`gh release delete` 没有保留资产的选项）。
  # 如需核对剩余完整性，期望资产数由 22 降为 **13**：
  # 9 平台安装包 + 1 `latest.json` + 3 便携版。
  #
  # ## 恢复条件
  #
  # ADR-045 的触发条件未失效：**出现第一个非本仓消费者**时恢复。恢复是一种
  # **决策**而非改动——须先改 ADR-045 状态、同步 README/AGENTS 的宣称、
  # 再连同 `scripts/verify-release-workflow.mjs` 的 `checkCliArtifactShape`
  # 一起改回来（它现在断言这两个 job **不得存在**，是防复活守卫）。
  # 不要只把 YAML 贴回来就以为完事——那样守卫会红，也绕过了「为什么删」的记录。
