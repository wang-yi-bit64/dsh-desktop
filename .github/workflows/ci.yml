name: CI

# 阶段 0 任务 0.4：三平台兜底。
# PR   → 静态检查 + 单测 + 补丁分级自检 + L1 烟雾（不组装 300MB 资源，快反馈）
# main/nightly → 额外组装资源、跑真实资源树的 L1 烟雾、打包、L2 GUI 烟雾、体积采集
#
# 门禁分层（为什么这样分）：
#   cargo test/clippy 测的是壳自己的逻辑，Harness 对它是黑盒，**覆盖不到**
#   Harness 侧行为变更与资源组装缺陷。smoke 的 L1/L2 补这一段。
#   L1 用 mock 资源树即可验证「宿主 → 子进程 → 就绪 → 服务页面 → 关闭 → 无孤儿」
#   这条链路，因此可以在 PR 上便宜地跑；真实资源树的 L1 放在 build job。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 补丁分级自检：patches/ 目录与 scripts/patch-layers.mjs 的登记表必须一致，
      # 且每个补丁文件名都能推导出包名。这是纯静态检查（不装依赖），放在最前面
      # 快速失败——补丁登记缺失会让 prepare:harness 在打包时才报错，代价高得多。
      - name: Verify patch layer manifest
        run: npm run verify:patches

      # 壳接口面一致性：`src-tauri` 是 rlib，`pub` 项在 clippy 看来一律「可达」，
      # 因此 `dead_code` **永远报不出**「写了但没人调用」的公开命令/页面。这类
      # 断线跨语言（Rust ↔ HTML），编译器看不见，只能静态比对：
      #   命令定义 ↔ generate_handler 注册 ↔ 前端 invoke / listen ↔ local_page 目标
      # 已经借此捕获过真实事故：error.html 调用了不存在的 `harness_start_safe_mode`
      # （注册名是 `safe_mode_action`），异常被 .catch 吞掉 → 按钮静默失效。
      # 纯静态、不需 npm install，放最前面快速失败。
      - name: Verify shell IPC surface
        run: npm run verify:ipc-surface

      # 壳内页面的**运行时**冒烟。上一条只比对命令名；这一条把每个页面的内联脚本
      # 放进 DOM 桩里真跑一遍，并逐个点一遍按钮，因此能抓到 E1~E6 看不见的两类缺陷：
      #   ① `getElementById` 拿到 null → 脚本自上而下执行、一抛就停，**整页监听全部失效**；
      #   ② HTML 留了按钮但脚本忘了绑监听（页面显示完全正常，按钮却是死的）。
      # 它从「实际调用点」一侧复查命令名，与上一条形成交叉。
      - name: Verify shell pages load and their buttons are wired
        run: npm run verify:shell-pages

      # 守卫脚本自己的自检：一个写错了却静默放行的守卫比没有守卫更危险。
      - name: Verify target guard self-test
        run: npm run verify:target -- --self-test

      # Harness 页注入脚本的行为自测（无头 + DOM 桩）。注入脚本的工作对象是真浏览器
      # DOM，若只靠「装进应用里手点一遍」验证，最容易被改坏的两处——可见性规则与
      # 「元素带着未定态漏出」这个上游回归——就没有自动化防线。
      # 脚本自带**可证伪性检查**：把上游行为打回一份变体，断言必须变红，否则报错。
      - name: Verify Harness UI injection behaviour
        run: npm run verify:harness-inject

      # 版本号一致性 + 变更日志生成器自测。
      #
      # 版本号散落在 package.json（唯一真源）/ tauri.conf.json（继承真源）/
      # Cargo.toml（脚本同步）三处，任一处漂移，打出来的包就会自称另一个版本；
      # 而 updater 的版本比较据此决定推不推更新——错一次就会让所有已安装用户
      # 收到「版本号没变」的更新，或永远收不到更新。因此这是一条契约门禁，
      # 不是格式美化。
      #
      # 后两条是生成器自身的自测：一个写错了却静默产出空变更日志的脚本，
      # 比没有脚本更危险（Release 页会显示「没有任何改动」）。
      - name: Verify version consistency and changelog generators
        run: |
          npm run verify:version
          npm run verify:commits
          npm run verify:changelog

      # src-tauri 是 workspace 成员，cargo test/clippy --workspace 必然编译它；
      # tauri-build 的 build.rs 要求 bundle.resources 每个 glob 至少匹配一个文件，
      # 而 src-tauri/resources/ 被 gitignore（全新 checkout 不存在）。这里用
      # git 已跟踪的 build/ 静态资产搭一个最小资源树（不组装 300MB 运行时），
      # 让 crate 能编译；真正打包仍由 build job 的 prepare:harness 负责。
      - name: Stub src-tauri resources (compile-only)
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # INV-6：主链路单测不依赖 GUI，也不依赖组装好的资源包。
      # T05：先跑无 GUI 两个 crate 的独立快门禁（快反馈；GUI 的 workspace
      # 测试依赖 tauri-build / 资源 glob，慢且偶发环境问题）。
      - name: "cargo test (headless fast gate: dsh-host + dsh-host-cli)"
        run: cargo test -p dsh-host -p dsh-host-cli

      - name: cargo test
        run: cargo test --workspace

  # L1 无头烟雾：证伪「宿主能派生 → 能就绪 → 真的在服务页面 → 关得干净」。
  # 用 mock 资源树（DSH_MOCK=1），因此不需要 npm install，也不需要显示器。
  smoke-headless:
    name: ${{ matrix.os }} / smoke L1
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build host CLI
        run: cargo build -p dsh-host-cli

      - name: Smoke L1 (mock resource tree)
        run: node scripts/smoke-launch.mjs --level=1 --resource-mode=stub

      # 故障注入：孤儿进程清理 + 退出码归因（6 类故障场景，10 项断言）。
      # 这是唯一能证伪「子进程在宿主崩溃后残留」的门禁——单测覆盖不到，
      # 因为要真的派生、真的杀。前置只有 `cargo build -p dsh-host-cli`，
      # 与上面的步骤复用同一份产物。
      #
      # Windows 已本地跑通 10/10（Job Object 路径）。Linux/macOS 走的是
      # PDEATHSIG / 进程组，尚无人工确认记录，因此先作为**信息性**步骤：
      # 失败留档但不阻断。确认全绿后把 continue-on-error 去掉转硬门禁。
      - name: Fault injection (orphan cleanup + exit-code attribution)
        continue-on-error: ${{ runner.os != 'Windows' }}
        run: npm run fault-inject

      # 失败时把烟雾报告留档——这一层的失败通常只在日志里可读
      # （就绪超时 / 页面取不到 / 退出码不对），不留档就得本地复现。
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-l1-logs-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: target/smoke/**

  build:
    name: ${{ matrix.os }} / bundle
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      # 每个平台**显式**声明要产出哪些包。
      #
      # 此前这里只写 `os: [...]`，打包命令是 `npm run tauri build`，实际 bundle
      # 类型由 tauri.conf.json 的 `bundle.targets`（当前只有 `nsis`）决定。nsis 是
      # Windows 专属类型，把它交给 macOS/Linux 去处理是在依赖 Tauri 的平台回退
      # 行为——那既没被文档承诺，也没法在本机验证。显式传 `--bundles` 之后，
      # 每个平台该产出什么一目了然，且与 release.yml 用同一套声明。
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4

      # L2 在 Linux 上走 xvfb-run，需要 xvfb；其余构建依赖同 test job。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tooling
        run: npm ci

      # 任务 0.3：资源组装必须可复现（内部会写 MANIFEST.json），且补丁分级
      # 策略记录在 MANIFEST.patches[] 里逐条留证。

      # 打包目标守卫：`prepare:harness` 会把**当前主机架构**的 Node 运行时
      # 组装进 `src-tauri/resources/node/`。若构建镜像里 node 与 rustc 架构
      # 不一致（或将来启用跨编译），产物会内嵌错误架构的运行时——在目标机上
      # 表现为「Harness 起不来」，而根因在构建期，事后极难归因。此步在组装
      # 300MB 之前失败，避免白跑一轮。目标自动推断：无参数时依次取
      # `TAURI_ENV_TARGET_TRIPLE`、`rustc -vV` 的 host triple。
      - name: Verify packaging target
        run: npm run verify:target

      - name: Prepare harness resources
        run: npm run prepare:harness

      - name: Verify bundled Node.js version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/resources/node/node.exe --version
          else
            ./src-tauri/resources/node/node --version
          fi

      - name: Build host CLI
        run: cargo build -p dsh-host-cli

      # 真实资源树上的 L1：这是**唯一**能发现「资源组装缺文件 / Harness 起不来 /
      # 补丁把入口改坏」的门禁。硬门禁，失败即阻断。
      - name: Smoke L1 (assembled resource tree)
        run: node scripts/smoke-launch.mjs --level=1 --resource-mode=assembled

      # 更新产物必须签名才能生成（`createUpdaterArtifacts: true`）。缺密钥时
      # tauri build 会在打包末尾才失败，白跑一轮 300MB 组装，因此先显式检查，
      # 并把「缺的是哪一项」写进错误信息。密钥只存在于 GitHub Secrets 与离线
      # 备份，绝不进仓库（见 README「Auto-update」一节）。
      #
      # 用 env 传值而不是把 `${{ secrets.* }}` 插进 run 字符串：后者一旦被
      # 回显就会把私钥写进构建日志。
      - name: Verify signing key is available
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set — updater artifacts cannot be signed. See README (Auto-update)."
            exit 1
          fi

      # 打真实安装包（含 prepare:harness 组装的 300MB 运行时），验证打包不缺
      # 资源。`npm run tauri -- build …` 会转发到 @tauri-apps/cli 的 tauri
      # 二进制（package.json 的 tauri script），不需要 cargo 子命令。
      #
      # `--bundles` 按平台显式指定（见上方 matrix 注释）：不要依赖
      # tauri.conf.json 的 bundle.targets，那里只有 Windows 的 nsis。
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      # L2：真实壳二进制启动观察窗 + 关闭后无孤儿。
      # 软门禁（continue-on-error）：GUI 在 CI 上受窗口管理器 / WebKit 版本影响，
      # 偶发失败不应伪装成产品缺陷；结果留档，由人判断是否回归。
      - name: Smoke L2 (GUI launch)
        continue-on-error: true
        run: node scripts/smoke-launch.mjs --level=2

      # 体积采集写入 job summary。README 不再维护会失真的手写数字。
      - name: Report bundle size
        run: node scripts/report-bundle-size.mjs --markdown

      - name: Upload smoke and size logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: target/smoke/**

