name: CI

# 阶段 0 任务 0.4：三平台兜底。
#
# 职责（2026-09-11 收敛）：**只跑静态门禁 + 单测**，不组装资源、不打包、不跑烟雾。
#   · PR            → 三平台 `test`（静态门禁 + clippy + 单测），快反馈
#   · 手动 dispatch → 同上，用于在分支上主动验证
#
# 其余两件事已有各自唯一的产地，别在这里重复实现：
#   · 冒烟测试（L1 会话烟雾 / L2 GUI 烟雾）→ `.github/workflows/smoke.yml`，**手动触发**。
#     它要真起子进程与窗口，assembled/full 还要组装 300MB 运行时，成本与「一次提交的
#     价值」不成比例，因此刻意不挂在自动触发上。要跑就去 Smoke 工作流按一下。
#   · 出包与发布 → `.github/workflows/release.yml`，**推 `v*` tag 触发**。
#
# 为什么本工作流不监听 `push`（含 main 与 tag）：日常提交零自动化。tag 上的出包由
# release.yml 负责；让 main 上每次提交都跑一遍编译矩阵，收益与成本不成比例。
#
# ⚠️ 代价必须写清楚（别让下一个人以为门禁还在）：日常提交不再自动跑 `cargo test` /
# clippy / 三平台矩阵，而 release.yml 的 preflight 只跑秒级静态门禁、看不见运行时行为。
# 因此**发布前请先手动 dispatch 本工作流（拿静态+单测）并 dispatch 一次 Smoke（拿冒烟）
# 且都确认全绿，再打 tag**。省略这一步，一个从未通过矩阵的提交会被直接打包发布。
#
# 2026-09-12 增设 `schedule`（每天一次）：这是上述代价的**部分补偿**——让 main 的 HEAD
# 最迟每 24 小时被静态门禁 + clippy + 单测验一次，避免「长期没人验过」拖到发版才暴露。
# 它是补充，**不是替代**发布前那两次手动 dispatch：定时任务不跑冒烟（起窗口那一步）。

on:
  # 刻意不监听 `push`（含 main 与 tag）：日常提交零自动化，出包只在 release.yml，
  # 冒烟只在 smoke.yml（手动）。
  pull_request:
  workflow_dispatch:
  # 定时跑一次（每天）——这是「日常零自动化」的**补偿机制**，不是把它加回来。
  #
  # 为什么需要它：摘掉 `push` 之后，`main` 的 HEAD 可能长期没人验过；而 release 的
  # preflight 只跑秒级静态门禁、看不见单测与 clippy，于是「给一个从未通过矩阵的
  # 提交打 tag」这件事没有任何自动化的最后一道网。定时跑把这道网补上，成本是
  # **一天一次**（而非每次提交一次），既不为日常提交加负担，也让 main 的绿色
  # 状态最迟在 24 小时内被证实或证伪。
  #
  # 定时任务固定在默认分支上运行（GitHub 的既有行为），因此检查的就是 main 的 HEAD。
  schedule:
    # 非整点，避开 Actions 的整点排队高峰（与 drift.yml 错开）。
    - cron: '41 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 补丁分级自检：patches/ 目录与 scripts/patch-layers.mjs 的登记表必须一致，
      # 且每个补丁文件名都能推导出包名。这是纯静态检查（不装依赖），放在最前面
      # 快速失败——补丁登记缺失会让 prepare:harness 在打包时才报错，代价高得多。
      - name: Verify patch layer manifest
        run: npm run verify:patches

      # 依赖树瘦身判据的自检。`prepare:harness` 会把 node_modules 里「像开发产物」
      # 的目录整目录删掉以缩小安装包，而 `doc` / `docs` 这类名字在某些包里恰好是
      # **运行时路径**（`yaml/dist/doc/directives.js`）。删错不会让任何静态检查变红：
      # 打包、签名、安装全部成功，只有 Harness 启动时抛 `Cannot find module`，
      # 也就是「装得上、起不来」。这里用可伪证性断言把这个判据钉住——同一条断言
      # 必须能复现旧判据的事故形态，否则自测自己就是失效的。
      - name: Verify dependency prune rules
        run: npm run verify:prune

      # 原生平台变体剪枝判据的自测。musl / 非目标架构的 prebuild 二进制留在树里时，
      # linuxdeploy 会在打包阶段解析它们的动态依赖并失败（`libc.musl-x86_64.so.1` 在
      # glibc runner 上无解）——而 tauri-bundler 默认吞掉真实报错，只留下
      # `failed to run linuxdeploy`。这条自测把判据钉住：既断言外来变体必被删除，
      # 也用「现有 prune 应当留下 musl」做可伪证性对照，证明缺陷逃得过旧门禁。
      - name: Verify platform variant prune rules
        run: npm run verify:variants

      # 发布工作流自身的静态判据（自测）。它守的是两类「只有真跑发布才炸」的缺陷：
      # tauri-action 的 tauriScript/args 拼装（重复 build → `unexpected argument`），
      # 以及 shell 变量紧邻非 ASCII 字符（macOS bash 3.2 会并入变量名）。
      # 两者都让 v0.1.0 首次发布三平台全红，且本地门禁全绿——因此必须在这里独立成门禁。
      - name: Verify release workflow guards
        run: npm run verify:release-workflow:self-test

      # 官方 profile 保留名守卫（纯静态，不联网）。官方桌面版独占 `desktop` 这个
      # profile 名及其**全部大小写变体**（已实现、未发布）。本仓当前未使用保留名
      # （安全模式是 `desktop-safe-mode`，默认是裸子命令 `web`），因此这是一道
      # **防回归**门禁：哪天有人顺手把某个 profile 命名成 `desktop`，在这里就红。
      # 同时校验两个契约锚点（SAFE_MODE_PROFILE / HARNESS_CLI）未被改向保留名。
      - name: Verify DSH profile reserved-name guard
        run: |
          npm run verify:profile-names
          npm run verify:profile-names:self-test

      # 上游版本漂移哨兵的**自检**（纯逻辑 + 无网络分支，不联网）。它守住哨兵
      # 自身的判定：落后 minor / 落后预发布阶段必须判失败，持平/领先必须判通过，
      # 取不到 registry 必须落到 SKIP 而不是冒充「已核对」。
      # ⚠️ 真检查（`npm run verify:drift`）**不放在这里**：它会因上游领先而红，
      # 属于「提醒升级」而非「代码有问题」，挂在每次提交上会长期制造红灯噪声；
      # 真检查跑在 `drift.yml` 的定时任务里。
      - name: Verify upstream drift sentinel self-test
        run: npm run verify:drift:self-test

      # 宣称纪律守卫（README ↔ AGENTS）。它把 §7 的「不得过度宣称」与「欠债必须登记」
      # 变成会失败的检查：禁止表述不得出现在 README；五种状态词表三处一致；§7.2 表里
      # 每个 ⚠️ 未接线 / ❌ 未实现 行都必须登记销账。此前这类漂移只能靠人读 grep 输出，
      # 2026-09-12 的评估正是这样抓到 README 一处「插件无法拖垮 Harness」的过度宣称。
      # 自带可证伪性自检（把修复前的坏句当夹具，必须报红）。
      - name: Verify claim discipline (README ↔ AGENTS)
        run: |
          npm run verify:claims
          npm run verify:claims:self-test

      # 壳接口面一致性：`src-tauri` 是 rlib，`pub` 项在 clippy 看来一律「可达」，
      # 因此 `dead_code` **永远报不出**「写了但没人调用」的公开命令/页面。这类
      # 断线跨语言（Rust ↔ HTML），编译器看不见，只能静态比对：
      #   命令定义 ↔ generate_handler 注册 ↔ 前端 invoke / listen ↔ local_page 目标
      # 已经借此捕获过真实事故：error.html 调用了不存在的 `harness_start_safe_mode`
      # （注册名是 `safe_mode_action`），异常被 .catch 吞掉 → 按钮静默失效。
      # 纯静态、不需 npm install，放最前面快速失败。
      - name: Verify shell IPC surface
        run: npm run verify:ipc-surface

      # 壳内页面的**运行时**冒烟。上一条只比对命令名；这一条把每个页面的内联脚本
      # 放进 DOM 桩里真跑一遍，并逐个点一遍按钮，因此能抓到 E1~E6 看不见的两类缺陷：
      #   ① `getElementById` 拿到 null → 脚本自上而下执行、一抛就停，**整页监听全部失效**；
      #   ② HTML 留了按钮但脚本忘了绑监听（页面显示完全正常，按钮却是死的）。
      # 它从「实际调用点」一侧复查命令名，与上一条形成交叉。
      - name: Verify shell pages load and their buttons are wired
        run: npm run verify:shell-pages

      # 守卫脚本自己的自检：一个写错了却静默放行的守卫比没有守卫更危险。
      - name: Verify target guard self-test
        run: npm run verify:target -- --self-test

      # Harness 页注入脚本的行为自测（无头 + DOM 桩）。注入脚本的工作对象是真浏览器
      # DOM，若只靠「装进应用里手点一遍」验证，最容易被改坏的两处——可见性规则与
      # 「元素带着未定态漏出」这个上游回归——就没有自动化防线。
      # 脚本自带**可证伪性检查**：把上游行为打回一份变体，断言必须变红，否则报错。
      - name: Verify Harness UI injection behaviour
        run: npm run verify:harness-inject

      # 版本号一致性 + 变更日志生成器自测。
      #
      # 版本号散落在 package.json（唯一真源）/ tauri.conf.json（继承真源）/
      # Cargo.toml（脚本同步）三处，任一处漂移，打出来的包就会自称另一个版本；
      # 而 updater 的版本比较据此决定推不推更新——错一次就会让所有已安装用户
      # 收到「版本号没变」的更新，或永远收不到更新。因此这是一条契约门禁，
      # 不是格式美化。
      #
      # 后两条是生成器自身的自测：一个写错了却静默产出空变更日志的脚本，
      # 比没有脚本更危险（Release 页会显示「没有任何改动」）。
      - name: Verify version consistency and changelog generators
        run: |
          npm run verify:version
          npm run verify:commits
          npm run verify:changelog

      # src-tauri 是 workspace 成员，cargo test/clippy --workspace 必然编译它；
      # tauri-build 的 build.rs 要求 bundle.resources 每个 glob 至少匹配一个文件，
      # 而 src-tauri/resources/ 被 gitignore（全新 checkout 不存在）。这里用
      # git 已跟踪的 build/ 静态资产搭一个最小资源树（不组装 300MB 运行时），
      # 让 crate 能编译；真正打包仍由 build job 的 prepare:harness 负责。
      - name: Stub src-tauri resources (compile-only)
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # INV-6：主链路单测不依赖 GUI，也不依赖组装好的资源包。
      # T05：先跑无 GUI 两个 crate 的独立快门禁（快反馈；GUI 的 workspace
      # 测试依赖 tauri-build / 资源 glob，慢且偶发环境问题）。
      - name: "cargo test (headless fast gate: dsh-host + dsh-host-cli)"
        run: cargo test -p dsh-host -p dsh-host-cli

      - name: cargo test
        run: cargo test --workspace
