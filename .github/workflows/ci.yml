name: CI

# 阶段 0 任务 0.4：三平台兜底。
# PR   → 静态检查 + 单测（不组装 300MB 资源，快反馈）
# main/nightly → 额外跑资源组装与打包，验证打包不缺资源

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # INV-6：主链路单测不依赖 GUI，也不依赖组装好的资源包。
      - name: cargo test
        run: cargo test --workspace

  build:
    name: ${{ matrix.os }} / bundle
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tooling
        run: npm ci

      # 任务 0.3：资源组装必须可复现（内部会写 MANIFEST.json）。
      - name: Prepare harness resources
        run: npm run prepare:harness

      - name: Verify bundled Node.js version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/resources/node/node.exe --version
          else
            ./src-tauri/resources/node/node --version
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose
