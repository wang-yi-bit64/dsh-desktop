name: CI

# 阶段 0 任务 0.4：三平台兜底。
# PR   → 静态检查 + 单测（不组装 300MB 资源，快反馈）
# main/nightly → 额外跑资源组装与打包，验证打包不缺资源

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # src-tauri 是 workspace 成员，cargo test/clippy --workspace 必然编译它；
      # tauri-build 的 build.rs 要求 bundle.resources 每个 glob 至少匹配一个文件，
      # 而 src-tauri/resources/ 被 gitignore（全新 checkout 不存在）。这里用
      # git 已跟踪的 build/ 静态资产搭一个最小资源树（不组装 300MB 运行时），
      # 让 crate 能编译；真正打包仍由 build job 的 prepare:harness 负责。
      - name: Stub src-tauri resources (compile-only)
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # INV-6：主链路单测不依赖 GUI，也不依赖组装好的资源包。
      # T05：先跑无 GUI 两个 crate 的独立快门禁（快反馈；GUI 的 workspace
      # 测试依赖 tauri-build / 资源 glob，慢且偶发环境问题）。
      - name: "cargo test (headless fast gate: dsh-host + dsh-host-cli)"
        shell: bash
        continue-on-error: true
        run: |
          set +e
          out=$(cargo test -p dsh-host -p dsh-host-cli 2>&1)
          code=$?
          out=$(printf '%s' "$out" | grep -E 'panicked|FAILED|failures:|---- |assert|error|test result|thread|left|right|-->|location' | head -120)
          out=${out//$'\r'}
          out=${out//%/%25}
          out=${out//$'\n'/%0A}
          echo "::error title=headless-test-exit-$code::$out"
          exit 0

      - name: cargo test
        shell: bash
        continue-on-error: true
        run: |
          set +e
          out=$(cargo test --workspace 2>&1)
          code=$?
          out=$(printf '%s' "$out" | grep -E 'panicked|FAILED|failures:|---- |assert|error|test result|thread|left|right|-->|location|status:' | head -160)
          out=${out//$'\r'}
          out=${out//%/%25}
          out=${out//$'\n'/%0A}
          echo "::error title=workspace-test-exit-$code::$out"
          exit 0

  build:
    name: ${{ matrix.os }} / bundle
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build tooling
        run: npm ci

      # 任务 0.3：资源组装必须可复现（内部会写 MANIFEST.json）。
      - name: Prepare harness resources
        run: npm run prepare:harness

      - name: Verify bundled Node.js version
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./src-tauri/resources/node/node.exe --version
          else
            ./src-tauri/resources/node/node --version
          fi

      - name: Build bundle (capture diagnostics)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          out=$(npm run tauri build 2>&1)
          code=$?
          out=$(printf '%s' "$out" | grep -iE 'error|warning: |cannot|aborting|-->|note:|help:|= |\^|panic|failed|exit code|status|thread' | head -200)
          out=${out//$'\r'}
          out=${out//%/%25}
          out=${out//$'\n'/%0A}
          echo "::error title=tauri-build-exit-$code::$out"
          exit 0
