name: CI

# 阶段 0 任务 0.4：三平台兜底。
#
# 职责（2026-09-11 收敛；2026-09-30 起分档——S4-1/S4-2）：**只跑静态门禁 + 单测**，
# 不组装资源、不打包、不跑烟雾。
#   · PR / dispatch → 三平台 `test`（静态门禁 + clippy + 单测 + 集成），**fast 档**：
#     `cargo test --workspace --tests`，不含 doc-test（44 项 ≥258s 归入 full 档）
#   · 每日 schedule → 同上 **+ doc-test**（full 档；ADR-055 的「最后一道网」语义）
#
# 其余两件事已有各自唯一的产地，别在这里重复实现：
#   · 冒烟测试（L1 会话烟雾 / L2 GUI 烟雾）→ `.github/workflows/smoke.yml`，**手动触发**。
#     它要真起子进程与窗口，assembled/full 还要组装 300MB 运行时，成本与「一次提交的
#     价值」不成比例，因此刻意不挂在自动触发上。要跑就去 Smoke 工作流按一下。
#   · 出包与发布 → `.github/workflows/release.yml`，**推 `v*` tag 触发**。
#
# 为什么本工作流不监听 `push`（含 main 与 tag）：日常提交零自动化。tag 上的出包由
# release.yml 负责；让 main 上每次提交都跑一遍编译矩阵，收益与成本不成比例。
#
# ⚠️ 代价必须写清楚（别让下一个人以为门禁还在）：日常提交不再自动跑 `cargo test` /
# clippy / 三平台矩阵，而 release.yml 的 preflight 只跑秒级静态门禁、看不见运行时行为。
# 因此**发布前请先手动 dispatch 本工作流（拿静态+单测）并 dispatch 一次 Smoke（拿冒烟）
# 且都确认全绿，再打 tag**。省略这一步，一个从未通过矩阵的提交会被直接打包发布。
#
# 2026-09-12 增设 `schedule`（每天一次）：这是上述代价的**部分补偿**——让 main 的 HEAD
# 最迟每 24 小时被静态门禁 + clippy + 单测验一次，避免「长期没人验过」拖到发版才暴露。
# 它是补充，**不是替代**发布前那两次手动 dispatch：定时任务不跑冒烟（起窗口那一步）。

on:
  # 刻意不监听 `push`（含 main 与 tag）：日常提交零自动化，出包只在 release.yml，
  # 冒烟只在 smoke.yml（手动）。
  pull_request:
  workflow_dispatch:
  # 定时跑一次（每天）——这是「日常零自动化」的**补偿机制**，不是把它加回来。
  #
  # 为什么需要它：摘掉 `push` 之后，`main` 的 HEAD 可能长期没人验过；而 release 的
  # preflight 只跑秒级静态门禁、看不见单测与 clippy，于是「给一个从未通过矩阵的
  # 提交打 tag」这件事没有任何自动化的最后一道网。定时跑把这道网补上，成本是
  # **一天一次**（而非每次提交一次），既不为日常提交加负担，也让 main 的绿色
  # 状态最迟在 24 小时内被证实或证伪。
  #
  # 定时任务固定在默认分支上运行（GitHub 的既有行为），因此检查的就是 main 的 HEAD。
  schedule:
    # 非整点，避开 Actions 的整点排队高峰（与 drift.yml 错开）。
    - cron: '41 2 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 是显式钉死：ubuntu-latest 自 2026-10-19 起滚动迁往
        # Ubuntu 26.04（actions/runner-images#14748），CI 先稳在 24.04。
        os:
          - windows-latest
          - macos-latest
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # 用了反斜杠续行就必须显式声明 bash——判据见 verify-release-workflow.mjs
        # 的 shell 可移植性守卫（PowerShell 的续行符是反引号，`\` 会被当成自减运算符）。
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de   # stable（SHA 钉死；工具链名经下方 toolchain 输入传入）
        with:
          toolchain: stable
          components: rustfmt, clippy

      # 供应链扫描（S3-2）：advisories + licenses 在役即失败；ignore 的每一条都附理由
      # 且与 README 安全节同源（见 deny.toml）。cargo-deny 默认解析**全目标**依赖图，
      # 在任一平台跑都能覆盖 gtk 栈——按计划只挂 Linux job。
      # 首跑实证（2026-09-30）：加 ignore 前对 RUSTSEC-2024-0370 报红、加后转绿。
      - name: cargo-deny (advisories + licenses)
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25   # v2
        with:
          command: check advisories licenses

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # ------------------------------------------------------------------
      # 静态门禁：**清单的唯一产地是 scripts/gate-manifest.mjs**（2026-10-03 治理 G1）。
      #
      # 这里刻意不再逐条抄 `npm run verify:*`。改版前三份手抄清单（本文件 /
      # release.yml / scripts/verify-fast.mjs）互相漂移，而漂移**不报错**——直接后果是
      # verify:unwrap-hygiene 的真检查、verify:doc-facts、verify:github-config、
      # verify:fault-patterns 四个守卫**写了却没有任何流程会跑**，同时文档还在宣称
      # 它们盯着代码（§7.3「门禁替一段不存在的检查背书」的原文形态）。
      #
      # 每个门禁「为什么有它」现在写在 gate-manifest.mjs 的 why 字段里（原先散在这里的
      # 步骤注释已逐条迁入），与门禁同生共死；分档 ci 的成员非空由 verify:gates 断言。
      # 平台受限的门禁（便携版打包器自检仅 Windows）由编排器打印 skip 与理由——不静默
      # 略过（§7.1 规则 3）。新增门禁只登记总表，不要在这里另抄一行。
      - name: Static gates (single source of truth: scripts/gate-manifest.mjs)
        run: npm run gate -- --tier=ci

      # src-tauri 是 workspace 成员，cargo test/clippy --workspace 必然编译它；
      # tauri-build 的 build.rs 要求 bundle.resources 每个 glob 至少匹配一个文件，
      # 而 src-tauri/resources/ 被 gitignore（全新 checkout 不存在）。这里用
      # git 已跟踪的 build/ 静态资产搭一个最小资源树（不组装 300MB 运行时），
      # 让 crate 能编译；真正打包仍由 build job 的 prepare:harness 负责。
      - name: Stub src-tauri resources (compile-only)
        run: node scripts/stub-tauri-resources.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # INV-6：主链路单测不依赖 GUI，也不依赖组装好的资源包。
      # T05：先跑无 GUI 两个 crate 的独立快门禁（快反馈；GUI 的 workspace
      # 测试依赖 tauri-build / 资源 glob，慢且偶发环境问题）。
      - name: "cargo test (headless fast gate: dsh-host + dsh-host-cli)"
        run: cargo test -p dsh-host -p dsh-host-cli      # 🗄️ 2026-09-24：此处原有「Build CLI and dry-run the publish steps」步骤
      # （`cargo build --release -p dsh-host-cli` + `npm run verify:cli-publish`）。
      # CLI 发布通道已退役（理由见 `release.yml` 的退役说明与
      # `docs/dev-plan-cli-distribution.md` §5），而 `verify:cli-publish` 的**唯一标的**
      # 就是 `cli-publish` 的上传步骤——上传取消后它失去意义，已连同脚本一起归档到
      # `docs/archive/dry-run-cli-publish.mjs`。
      #
      # 注意这里**不再**构建 CLI：crate 本身仍由下面的 `cargo test --workspace`、
      # 以及 smoke.yml 的 `cargo build -p dsh-host-cli` 覆盖，本步骤去掉不减少
      # 任何有效覆盖（它当初存在的理由只是为演练准备一个 release 二进制）。
      # 打包器的判据仍由上面的静态门禁档（`npm run gate -- cli-package`，纯逻辑、秒级）守着。

      # S4-2 门禁分档：PR / dispatch 路径只跑 fast 档——`--tests` = 单测 + 集成测试，
      # **不含 doc-test**（44 项 doc-test 单轮 ≥258s，是快反馈的最大单项成本）。
      # doc-test 归入 full 档，由下面的 schedule-only 步骤承接（每日一次的
      # 「最后一道网」语义，与 ADR-055 一致）；发布前也可本地 `npm run verify:full`。
      - name: "cargo test (fast tier: unit + integration, no doc-tests)"
        run: cargo test --workspace --tests

      - name: cargo doc-test (full tier, schedule only)
        if: github.event_name == 'schedule'
        run: cargo test --workspace --doc
