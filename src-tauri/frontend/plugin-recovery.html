<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-soft: #f5f6f7;
        --ink: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --line: #e4e4e7;
        --line-strong: #d4d4d8;
        --button: #18181b;
        --button-hover: #303034;
        --primary-ink: #ffffff;
        --danger: #c33b38;
        --success: #267a4a;
        --shadow: 0 12px 34px rgba(24, 24, 27, 0.1);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 40px 24px;
        color: var(--ink);
        background: var(--canvas);
      }

      button { font: inherit; }
      .shell {
        width: min(700px, 100%);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 26px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .content { padding: 30px 32px 22px; }
      .progress, .notice {
        display: none;
        margin: 0 0 18px;
        padding: 11px 13px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
      }
      .progress { color: var(--ink); border: 1px solid var(--line); background: var(--surface-soft); }
      .notice { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .notice.success { color: var(--success); background: rgba(38, 122, 74, 0.09); }
      .progress.visible, .notice.visible { display: block; }
      h1 {
        margin: 0;
        max-width: 590px;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .summary {
        margin: 8px 0 20px;
        max-width: 610px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .summary:empty { display: none; }

      .conflict-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
      }
      .reason { padding: 17px 19px 16px; }
      .reason-label {
        margin: 0 0 7px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 680;
      }
      .reason-detail {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .plugins {
        display: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }
      .plugins.visible { display: block; }
      .plugins li {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        padding: 10px 19px;
        border-top: 1px solid var(--line);
      }
      .plugins li:first-child { border-top: 0; }
      .plugin-mark {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        font-weight: 750;
      }
      .plugin-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }

      .safety {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        flex: 0 1 auto;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .safety-icon {
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        margin-top: 1px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .decision-row {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 12px;
        margin-top: 22px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 auto;
        gap: 9px;
        margin: 0;
      }
      .button {
        min-height: 39px;
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 620;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .button:hover { background: var(--surface-soft); }
      .button:active { transform: translateY(1px); }
      .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .button.primary {
        border-color: var(--button);
        color: var(--primary-ink);
        background: var(--button);
      }
      .button.primary:hover { border-color: var(--button-hover); background: var(--button-hover); }
      .button[disabled] { opacity: 0.64; cursor: progress; transform: none; }

      .advanced {
        margin-top: 24px;
        border-top: 1px solid var(--line);
      }
      .advanced summary {
        display: inline-flex;
        align-items: center;
        padding: 14px 2px 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 630;
        list-style: none;
      }
      .advanced summary::-webkit-details-marker { display: none; }
      .advanced summary::after {
        width: 6px;
        height: 6px;
        margin-left: 8px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(-45deg);
        transform-origin: center;
      }
      .advanced[open] summary::after { transform: rotate(45deg) translateY(-1px); }
      .advanced-body { padding: 13px 0 2px; }
      .meta-label {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .path, .technical {
        margin: 0 0 14px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .technical { max-height: 260px; overflow: auto; }
      .advanced-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .text-button {
        min-height: 32px;
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .text-button:hover { color: var(--ink); background: var(--surface-soft); }
      .text-button.danger:hover { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
        padding: 11px 26px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        background: var(--surface);
        font-size: 11px;
      }
      @media (max-width: 620px) {
        body { display: block; padding: 46px 0 0; background: var(--surface); }
        .shell { width: 100%; min-height: calc(100vh - 46px); border: 0; border-radius: 0; box-shadow: none; }
        .header { padding-inline: 20px; }
        .content { padding: 24px 20px 16px; }
        .decision-row { align-items: stretch; }
        .actions { align-items: stretch; flex-direction: column-reverse; }
        .button { width: 100%; }
        .footer { padding-inline: 20px; }
      }

      :root[data-theme="dark"] {
        --canvas: #141416;
        --surface: #202023;
        --surface-soft: #29292d;
        --ink: #f2f2f4;
        --muted: #a5a7ad;
        --faint: #7f8289;
        --line: #3a3a3f;
        --line-strong: #4a4a50;
        --button: #f4f4f5;
        --button-hover: #ffffff;
        --primary-ink: #111217;
        --danger: #ee7772;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: #141416;
          --surface: #202023;
          --surface-soft: #29292d;
          --ink: #f2f2f4;
          --muted: #a5a7ad;
          --faint: #7f8289;
          --line: #3a3a3f;
          --line-strong: #4a4a50;
          --button: #f4f4f5;
          --button-hover: #ffffff;
          --primary-ink: #111217;
          --danger: #ee7772;
          --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="heading">
      <header class="header">
        <div class="brand">
          <img id="icon" src="assets/app-icon.png" alt="" />
          <span class="brand-name" id="brand">DSH Desktop</span>
          <span class="badge" id="badge"></span>
        </div>
      </header>

      <section class="content">
        <p class="progress" id="progress"></p>
        <p class="notice" id="notice" role="alert"></p>
        <h1 id="heading"></h1>
        <p class="summary" id="summary"></p>

        <section class="conflict-card" aria-label="Plugin recovery details">
          <div class="reason">
            <p class="reason-label" id="reason-title"></p>
            <p class="reason-detail" id="reason-detail"></p>
          </div>
          <ul class="plugins" id="plugins"></ul>
        </section>

        <div class="decision-row">
          <div class="actions">
            <button class="button primary" id="primary" type="button"></button>
          </div>
          <p class="safety">
            <span class="safety-icon" aria-hidden="true">✓</span>
            <span id="safety-note"></span>
          </p>
        </div>

        <details class="advanced">
          <summary id="advanced-label"></summary>
          <div class="advanced-body">
            <p class="meta-label" id="error-label"></p>
            <pre class="technical" id="technical"></pre>
            <div class="advanced-actions">
              <button class="text-button" id="restart" type="button"></button>
              <button class="text-button" id="show-log" type="button"></button>
            </div>
          </div>
        </details>
      </section>

      <footer class="footer">
        <button class="text-button" id="quit" type="button"></button>
      </footer>
    </main>

    <script>
      const zh = navigator.language.toLowerCase().startsWith('zh');
      document.documentElement.lang = zh ? 'zh-CN' : 'en';

      const copy = zh
        ? {
            badge: '插件恢复',
            heading: '有一个插件可能阻止了 Harness 启动',
            summary: '进入安全模式后，第三方插件会被隔离，应用可以先起来。',
            reasonTitle: '启动失败的归因',
            reasonDetail: '以下结论来自本次启动的日志分析。',
            pluginsTitle: '疑似故障插件',
            safetyNote: '本页不会删除或改动你的任何插件数据。',
            primary: '进入安全模式',
            primaryBusy: '正在进入安全模式…',
            advanced: '技术细节',
            errorLabel: '归因报告',
            restart: '重启 Harness',
            showLog: '打开日志目录',
            quit: '退出 DSH Desktop',
            running: 'Harness 状态：',
            progress: '已请求进入安全模式，正在重启…',
            noPlugins: '未能从日志中定位到具体插件，可先按下面的按钮进入安全模式并在市场里逐个排查。',
            failed: '操作失败',
          }
        : {
            badge: 'Plugin recovery',
            heading: 'A plugin may have prevented Harness from starting',
            summary:
              'Safe Mode isolates third-party plugins so the app can start again.',
            reasonTitle: 'What the logs say',
            reasonDetail: 'This conclusion comes from analysing the current startup logs.',
            pluginsTitle: 'Suspected plugins',
            safetyNote: 'Nothing on this page deletes or modifies your plugin data.',
            primary: 'Enter Safe Mode',
            primaryBusy: 'Entering Safe Mode…',
            advanced: 'Technical details',
            errorLabel: 'Attribution report',
            restart: 'Restart Harness',
            showLog: 'Open log folder',
            quit: 'Quit DSH Desktop',
            running: 'Harness status: ',
            progress: 'Safe Mode requested — restarting…',
            noPlugins:
              'No specific plugin could be identified from the logs. Enter Safe Mode below, then narrow it down in the market.',
            failed: 'Action failed',
          }

      const invoke = window.__TAURI__?.core?.invoke
      const setText = (id, value) => {
        const node = document.getElementById(id)
        if (node) node.textContent = value || ''
      }
      const progressEl = document.getElementById('progress')
      const noticeEl = document.getElementById('notice')
      const primaryBtn = document.getElementById('primary')

      setText('badge', copy.badge)
      setText('heading', copy.heading)
      setText('summary', copy.summary)
      setText('reason-title', copy.reasonTitle)
      setText('reason-detail', copy.reasonDetail)
      setText('safety-note', copy.safetyNote)
      setText('primary', copy.primary)
      setText('advanced-label', copy.advanced)
      setText('error-label', copy.errorLabel)
      setText('restart', copy.restart)
      setText('show-log', copy.showLog)
      setText('quit', copy.quit)

      /**
       * 显示动作失败原因。
       *
       * 恢复页是「应用已经起不来」的场景，用户不会开 DevTools：任何失败都
       * 必须落在页面上。命令面现在返回封套（`success=false` 时带 `error.code`
       * / `error.category`），因此这里读的是结构化错误，不是字符串匹配。
       */
      function fail(label, error) {
        const detail =
          error && error.message ? error.message : String(error)
        const code = error && error.code ? `${error.code}: ` : ''
        noticeEl.textContent = `${label} — ${code}${detail}`
        noticeEl.classList.remove('success')
        noticeEl.classList.add('visible')
      }

      function succeed(message) {
        noticeEl.textContent = message
        noticeEl.classList.add('success', 'visible')
      }

      function clearNotice() {
        noticeEl.classList.remove('visible', 'success')
        noticeEl.textContent = ''
      }

      /**
       * 执行一个壳命令并**检查封套结果**。
       *
       * 这里必须解包 `envelope.success`：命令面刻意用「成功返回里的失败」
       * （而不是 reject）表达业务失败，若只看 promise 有没有 reject，
       * 未知动作这类错误会被当成成功——那正是原页面按钮「点了没反应」的
       * 成因之一。
       * @param {string} command 已注册的 Tauri 命令名
       * @param {string} label 本地化动作名
       * @param {object} [args] 命令参数
       * @param {HTMLButtonElement} [button] 触发按钮
       * @param {(data: unknown) => void} [onSuccess] 成功回调
       */
      function run(command, label, args, button, onSuccess) {
        if (!invoke) {
          fail(label, zh ? '宿主桥不可用' : 'host bridge unavailable')
          return
        }
        clearNotice()
        if (button) button.disabled = true
        invoke(command, args)
          .then((envelope) => {
            if (envelope && envelope.success === false) {
              if (button) button.disabled = false
              fail(label, envelope.error || {})
              return
            }
            if (button) button.disabled = false
            if (onSuccess) onSuccess(envelope ? envelope.data : undefined)
          })
          .catch((error) => {
            if (button) button.disabled = false
            fail(label, error)
          })
      }

      function render(status) {
        if (!status) return
        const plugins = Array.isArray(status.plugins) ? status.plugins : []
        const list = document.getElementById('plugins')
        list.textContent = ''
        if (plugins.length > 0) {
          list.classList.add('visible')
          for (const plugin of plugins) {
            const item = document.createElement('li')
            const mark = document.createElement('span')
            mark.className = 'plugin-mark'
            mark.setAttribute('aria-hidden', 'true')
            mark.textContent = '!'
            const name = document.createElement('span')
            name.className = 'plugin-name'
            name.textContent = String(plugin)
            item.append(mark, name)
            list.appendChild(item)
          }
        } else {
          list.classList.remove('visible')
        }
        setText(
          'summary',
          plugins.length > 0
            ? zh
              ? `疑似 ${plugins.length} 个第三方插件导致了启动失败。进入安全模式后它们会被隔离。`
              : `${plugins.length} third-party plugin(s) may have caused the failure. Safe Mode isolates them.`
            : copy.noPlugins
        )
        setText('technical', status.report || '')
      }

      /**
       * 反映 Harness 的实时状态（D11）。
       *
       * 原页面不监听任何事件，因此恢复过程中页面完全静止——点了按钮之后
       * 用户看不到「正在重启」。这条监听补上这个反馈。
       */
      function applySnapshot(snapshot) {
        if (!snapshot || !snapshot.phase) return
        const phase = snapshot.phase
        progressEl.textContent = `${copy.running}${phase}${
          snapshot.message ? ` — ${snapshot.message}` : ''
        }`
        progressEl.classList.add('visible')
        if (phase === 'ready') {
          // Harness 起来了：恢复页的使命结束，回到界面。
          run('harness_open', copy.running)
        }
      }

      if (window.__TAURI__?.event) {
        window.__TAURI__.event.listen('harness://status', (event) => {
          applySnapshot(event.payload || {})
        })
      }

      if (invoke) {
        // 一次调用拿齐全部数据：`recovery_status` 的载荷里已经带了相位快照
        // （`snapshot`），因此**不需要**再单独调 `harness_status`——同一份数据
        // 走两个命令只会让「哪个是权威」变得含糊。事件监听负责后续更新。
        run('recovery_status', copy.reasonTitle, undefined, undefined, (status) => {
          render(status)
          if (status) applySnapshot(status.snapshot)
        })
      }

      primaryBtn.addEventListener('click', () => {
        primaryBtn.disabled = true
        primaryBtn.textContent = copy.primaryBusy
        progressEl.textContent = copy.progress
        progressEl.classList.add('visible')
        // 主按钮：以安全模式启动（隔离第三方插件）。
        //
        // 原按钮的文案是「卸载插件」并调用 `window.dshRecovery.action('uninstall')`
        // ——一个从未存在过的桥。**卸载/禁用能力刻意未实现**：改动插件目录会在
        // 冷启动投影时被还原（挂载状态由 `profiles/.generations/desired.json`
        // 单一权威描述），而真删除不可逆。理由与证据见 `commands.rs`
        // 的 `recovery_action` 文档。
        run(
          'recovery_action',
          copy.primary,
          { action: 'safe-mode' },
          primaryBtn,
          () => {
            progressEl.textContent = copy.progress
            progressEl.classList.add('visible')
          }
        )
      })
      document.getElementById('restart').addEventListener('click', (event) => {
        run('recovery_action', copy.restart, { action: 'restart' }, event.currentTarget)
      })
      document.getElementById('show-log').addEventListener('click', (event) => {
        run('recovery_action', copy.showLog, { action: 'show-log' }, event.currentTarget)
      })
      document.getElementById('quit').addEventListener('click', (event) => {
        run('recovery_action', copy.quit, { action: 'quit' }, event.currentTarget)
      })
    </script>
  </body>
</html>
