<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed; inset: 0;
        display: grid; align-content: center; justify-items: center;
        gap: 14px; padding: 32px; text-align: center;
      }
      .icon { font-size: 40px; }
      .title { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
      .message { margin: 0; color: #777a80; font-size: 13px; max-width: 520px; white-space: pre-wrap; word-break: break-word; }
      .logs {
        margin: 4px 0 0; padding: 12px 16px; max-width: 640px; max-height: 200px; overflow: auto;
        text-align: left; font: 12px/1.5 Consolas, "Courier New", monospace;
        color: #9ca0a8; background: rgba(127,127,127,.08); border-radius: 10px;
        white-space: pre-wrap; word-break: break-all;
      }
      .actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
      button {
        appearance: none; border: 0; cursor: pointer; font: inherit;
        min-height: 34px; padding: 7px 18px; border-radius: 999px;
        font-size: 13px; font-weight: 600;
      }
      button[disabled] { opacity: .55; cursor: progress; }
      .primary { color: #fff; background: #4d6bfe; }
      .primary:hover { background: #3e5de7; }
      .secondary { color: #3f3f46; background: #ececee; border: 1px solid rgba(32,33,36,.14); }
      .secondary:hover { background: #e2e2e5; }
      /* 动作失败的可见出口。此前失败只进 console.error，页面上毫无痕迹——
         「点了没反应」让用户和排障者都无从判断，因此失败必须落在页面上。 */
      .notice {
        margin: 0; padding: 8px 14px; max-width: 640px;
        color: #8a2c2c; background: rgba(220,38,38,.10);
        border: 1px solid rgba(220,38,38,.28); border-radius: 8px;
        font-size: 12px; white-space: pre-wrap; word-break: break-word;
      }
      .notice.success {
        color: #1c6b42; background: rgba(38,122,74,.10);
        border-color: rgba(38,122,74,.30);
      }
      :root[data-theme='dark'] body, @media (prefers-color-scheme: dark) { }
      @media (prefers-color-scheme: dark) {
        body { color: #f3f4f6; background: #141416; }
        .message { color: #9ca0a8; }
        .secondary { color: #e4e4e7; background: #2a2a2e; border-color: rgba(255,255,255,.16); }
        .secondary:hover { background: #34343a; }
        .notice { color: #fca5a5; background: rgba(220,38,38,.16); border-color: rgba(248,113,113,.32); }
        .notice.success { color: #8ee0ae; background: rgba(38,122,74,.18); border-color: rgba(38,122,74,.40); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⚠️</div>
      <h1 class="title" id="title">Harness could not start</h1>
      <p class="message" id="message"></p>
      <pre class="logs" id="logs" hidden></pre>
      <p class="notice" id="notice" hidden></p>
      <div class="actions">
        <button class="primary" id="retry">Retry</button>
        <button class="secondary" id="safemode" hidden>Safe Mode</button>
        <button class="secondary" id="recovery" hidden>Plugin recovery…</button>
        <button class="secondary" id="export">Export diagnostics</button>
        <button class="secondary" id="openlogs">View log</button>
        <button class="secondary" id="quit">Quit</button>
      </div>
    </main>
    <script>
      const zh = navigator.language.toLowerCase().startsWith('zh');
      if (zh) {
        document.getElementById('title').textContent = 'Harness 未能启动';
        document.getElementById('retry').textContent = '重试';
        document.getElementById('safemode').textContent = '进入安全模式';
        document.getElementById('recovery').textContent = '插件恢复…';
        document.getElementById('export').textContent = '导出诊断包';
        document.getElementById('openlogs').textContent = '查看日志';
        document.getElementById('quit').textContent = '退出';
      }
      const invoke = window.__TAURI__?.core?.invoke;
      const messageEl = document.getElementById('message');
      const logsEl = document.getElementById('logs');
      const noticeEl = document.getElementById('notice');
      const safeModeBtn = document.getElementById('safemode');

      /**
       * 显示动作失败原因。
       *
       * 不用 console.error 兜底：错误页的用户正处于「应用起不来」的场景，
       * 他们不会开 DevTools。失败必须落在页面上，否则一次拼错的命令名
       * 就会表现为「按钮点了没反应」——2026-09-10 之前正是如此。
       * @param {string} label 动作名（已本地化）
       * @param {unknown} error 失败原因
       */
      function fail(label, error) {
        const code = error && error.code ? `${error.code}: ` : '';
        const detail = error && error.message ? error.message : String(error);
        noticeEl.textContent = zh
          ? `${label}失败：${code}${detail}`
          : `${label} failed: ${code}${detail}`;
        noticeEl.classList.remove('success');
        noticeEl.hidden = false;
      }

      function clearNotice() {
        noticeEl.hidden = true;
        noticeEl.textContent = '';
        noticeEl.classList.remove('success');
      }

      /** 成功回执（如导出诊断包：没有导航副作用，必须给可见回执）。 */
      function succeed(message) {
        noticeEl.textContent = message;
        noticeEl.classList.add('success');
        noticeEl.hidden = false;
      }

      /**
       * 执行一个壳命令，失败时在页面上可见。
       *
       * 成功路径通常会导致页面被导航覆盖（重启/退出），因此只在失败时恢复按钮，
       * 避免与即将消失的页面抢状态。
       *
       * **必须解包封套**：命令面现在一律返回 `{success, data, error}`，
       * 业务失败也是成功返回（`success=false`）而不是 reject。只看 promise
       * 有没有 reject，会把这类失败当成成功——页面照样「点了没反应」。
       * @param {string} command 已注册的 Tauri 命令名
       * @param {string} label 本地化动作名
       * @param {object} [args] 命令参数
       * @param {HTMLButtonElement} [button] 触发按钮（用于禁用与恢复）
       * @param {(data: unknown) => void} [onSuccess] 成功回调（拿到 `data`）
       */
      function run(command, label, args, button, onSuccess) {
        if (!invoke) return;
        clearNotice();
        if (button) button.disabled = true;
        invoke(command, args)
          .then((envelope) => {
            if (envelope && envelope.success === false) {
              if (button) button.disabled = false;
              fail(label, envelope.error || {});
              return;
            }
            if (button) button.disabled = false;
            if (onSuccess) onSuccess(envelope ? envelope.data : undefined);
          })
          .catch((error) => {
            if (button) button.disabled = false;
            fail(label, error);
          });
      }

      function apply(snapshot) {
        if (!snapshot) return;
        if (snapshot.message) messageEl.textContent = snapshot.message;
        // Failed 相位的结构化归因（任务 1.4）：kind / plugin_fault / retryable。
        //
        // 这里的 `snapshot.phase === 'failed'` 依赖一个**跨语言契约**：Rust 侧
        // `HarnessSnapshot.phase` 带 `#[serde(flatten)]`，tag 与 message / logs 平铺。
        // 2026-09-10 之前该属性缺失，服务端发的是 `{phase:{phase:'failed',…}}`，
        // 于是本判据**恒为 false**，「疑似插件故障」提示与安全模式按钮从未出现过。
        // 若要让这条分支继续工作，就不要去掉 state.rs 里的 flatten；
        // `snapshot_json_keeps_the_phase_tag_flat` 在 CI 中守护它。
        if (snapshot.phase === 'failed' && snapshot.plugin_fault) {
          const hint = zh
            ? '\n（疑似第三方插件故障：建议进入安全模式或打开插件恢复页）'
            : '\n(Plugin fault suspected: enter Safe Mode, or open the plugin recovery page.)';
          if (!messageEl.textContent.includes(hint)) messageEl.textContent += hint;
          safeModeBtn.hidden = false;
          // 恢复页（批次 C1）：展示嫌疑插件清单与归因报告，并提供安全模式 /
          // 重启 / 打开日志。错误页仍是插件故障的**第一落点**——恢复页从这里的
          // 按钮进入，而不是由 `state.rs::on_failed` 自动跳过去：那会让
          // error.html 刚修好的插件故障分支立刻变成新的死 UI。
          recoveryBtn.hidden = false;
        }
      }

      function loadLogs() {
        if (!invoke) return;
        invoke('harness_logs_tail', { count: 30 }).then((envelope) => {
          const lines = envelope && envelope.success !== false ? envelope.data : undefined;
          if (Array.isArray(lines) && lines.length) {
            logsEl.textContent = lines.join('\n');
            logsEl.hidden = false;
          }
        }).catch(() => {});
      }

      if (window.__TAURI__?.event) {
        window.__TAURI__.event.listen('harness://status', (event) => {
          apply(event.payload || {});
        });
      }
      // 进入页面立即拉取最新快照与日志尾部。
      if (invoke) {
        invoke('harness_status')
          .then((envelope) => {
            if (envelope && envelope.success !== false) apply(envelope.data);
          })
          .catch(() => {});
        loadLogs();
      }
      const retryBtn = document.getElementById('retry');
      const openLogsBtn = document.getElementById('openlogs');
      const quitBtn = document.getElementById('quit');
      const exportBtn = document.getElementById('export');
      const recoveryBtn = document.getElementById('recovery');

      // 诊断包导出（批次 D3）：产物落在 userData/exports/ 下，按钮的回执里
      // 必须把**路径**显示出来，否则用户找不到刚导出的东西。
      exportBtn.addEventListener('click', () => {
        run('diagnostics_export', zh ? '导出诊断包' : 'Export diagnostics', undefined, exportBtn, (data) => {
          const where = data && data.path ? data.path : '';
          const redactions = Array.isArray(data && data.redactions) ? data.redactions.length : 0;
          succeed(
            zh
              ? `诊断包已导出：${where}\n已按 ${redactions} 类规则脱敏（token / cookie / 用户名 / API key）。`
              : `Diagnostics bundle exported: ${where}\nRedacted with ${redactions} rule class(es) (tokens, cookies, user names, API keys).`
          );
        });
      });
      recoveryBtn.addEventListener('click', () => {
        run('recovery_open', zh ? '插件恢复' : 'Plugin recovery', undefined, recoveryBtn);
      });

      retryBtn.addEventListener('click', () => {
        run('harness_restart', zh ? '重试' : 'Retry', undefined, retryBtn);
      });
      // 命令名必须是 generate_handler! 里注册的那个：`safe_mode_action`，
      // 通过 `action` 参数区分动作。此前这里写的是并不存在的
      // `harness_start_safe_mode`，异常又被 catch 吞掉，导致「进入安全模式」
      // 静默失效（no-op）。命令面与调用面的一致性现由
      // scripts/verify-ipc-surface.mjs 在 CI 中守护。
      safeModeBtn.addEventListener('click', () => {
        run('safe_mode_action', zh ? '进入安全模式' : 'Safe Mode', { action: 'restart' }, safeModeBtn);
      });
      openLogsBtn.addEventListener('click', () => {
        run('open_logs', zh ? '打开日志' : 'View log', undefined, openLogsBtn);
      });
      quitBtn.addEventListener('click', () => {
        run('app_quit', zh ? '退出' : 'Quit', undefined, quitBtn);
      });
    </script>
  </body>
</html>
