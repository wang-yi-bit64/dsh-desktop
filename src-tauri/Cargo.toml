[package]
name = "dsh-desktop"
version.workspace = true
description = "A Rust + Tauri 2.0 desktop shell for DeepSeek Harness"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dsh_desktop_lib"
# Desktop-only build: rlib is what main.rs links against. cdylib/staticlib
# are only needed for mobile targets and overflow the GNU linker's export
# ordinal table on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dsh-contracts.workspace = true
dsh-host.workspace = true
# 注意：`dsh-model-gateway`（多厂商工具调用 Schema 方言网关）**不在本仓的
# 运行时路径上，且已于 2026-09-10 随批次 F「冻结并归档」从 workspace 移除**：
# 它从未被 `src-tauri` 引用，也不存在于任何调用图中。设计文档已归档到
# `docs/archive/model_gateway_design.md`。要恢复它必须先按该文档的退出条件
# 重新裁定——不要因为「代码写得不错」直接加回来。
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
regex = "1"
url = "2"
rand = "0.8"
qrcode = "0.14"
axum = "0.7"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Cookie 清理仅在 Windows 平台通过 JS eval 执行（不需要引入外部动态链接的 webview2-com / WebView2Loader.dll）
windows-sys.workspace = true
