[package]
name = "dsh-desktop"
version.workspace = true
description = "A Rust + Tauri 2.0 desktop shell for DeepSeek Harness"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dsh_desktop_lib"
# Desktop-only build: rlib is what main.rs links against. cdylib/staticlib
# are only needed for mobile targets and overflow the GNU linker's export
# ordinal table on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dsh-host.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex = "1"
url = "2"
rand = "0.8"
qrcode = "0.14"
axum = "0.7"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Cookie 清理需要与 wry 相同的 WebView2 COM 绑定版本（见 src/cookies.rs）。
webview2-com = "0.38"
windows-sys.workspace = true
# cookies.rs 需要命名 windows::core 的 PWSTR 并通过 Interface::cast 把
# ICoreWebView2 升到 ICoreWebView2_19（webview2-com 0.38 依赖 windows 0.61，
# 该版本已存在解析中，仅需显式声明以便直接 use）。
windows = "0.61"
