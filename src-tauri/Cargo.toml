[package]
name = "dsh-desktop"
version.workspace = true
description = "A Rust + Tauri 2.0 desktop shell for DeepSeek Harness"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dsh_desktop_lib"
# Desktop-only build: rlib is what main.rs links against. cdylib/staticlib
# are only needed for mobile targets and overflow the GNU linker's export
# ordinal table on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
dsh-contracts.workspace = true
dsh-host.workspace = true
dsh-model-gateway.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex = "1"
url = "2"
rand = "0.8"
qrcode = "0.14"
axum = "0.7"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# Cookie 清理仅在 Windows 平台通过 JS eval 执行（不需要引入外部动态链接的 webview2-com / WebView2Loader.dll）
windows-sys.workspace = true
