[package]
name = "dsh-desktop"
version = "0.1.0"
description = "A Rust + Tauri 2.0 desktop shell for DeepSeek Harness"
authors = ["DataElement"]
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
# Desktop-only build: rlib is what main.rs links against. cdylib/staticlib
# are only needed for mobile targets and overflow the GNU linker's export
# ordinal table on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "process",
  "io-util",
  "net",
  "sync",
  "fs",
] }
regex = "1"
url = "2"
rand = "0.8"
qrcode = "0.14"
axum = "0.7"
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
