<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed; inset: 0;
        display: grid; align-content: center; justify-items: center;
        gap: 14px; padding: 32px; text-align: center;
      }
      .icon { font-size: 40px; }
      .title { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
      .message { margin: 0; color: #777a80; font-size: 13px; max-width: 520px; white-space: pre-wrap; word-break: break-word; }
      .actions { display: flex; gap: 10px; margin-top: 8px; }
      button {
        appearance: none; border: 0; cursor: pointer; font: inherit;
        min-height: 34px; padding: 7px 18px; border-radius: 999px;
        font-size: 13px; font-weight: 600;
      }
      .primary { color: #fff; background: #4d6bfe; }
      .primary:hover { background: #3e5de7; }
      .secondary { color: #3f3f46; background: #ececee; border: 1px solid rgba(32,33,36,.14); }
      .secondary:hover { background: #e2e2e5; }
      :root[data-theme='dark'] body, @media (prefers-color-scheme: dark) { }
      @media (prefers-color-scheme: dark) {
        body { color: #f3f4f6; background: #141416; }
        .message { color: #9ca0a8; }
        .secondary { color: #e4e4e7; background: #2a2a2e; border-color: rgba(255,255,255,.16); }
        .secondary:hover { background: #34343a; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⚠️</div>
      <h1 class="title" id="title">Harness could not start</h1>
      <p class="message" id="message"></p>
      <div class="actions">
        <button class="primary" id="retry">Retry</button>
        <button class="secondary" id="logs">View log</button>
        <button class="secondary" id="quit">Quit</button>
      </div>
    </main>
    <script>
      const zh = navigator.language.toLowerCase().startsWith('zh');
      if (zh) {
        document.getElementById('title').textContent = 'Harness 未能启动';
        document.getElementById('retry').textContent = '重试';
        document.getElementById('logs').textContent = '查看日志';
        document.getElementById('quit').textContent = '退出';
      }
      const invoke = window.__TAURI__?.core?.invoke;
      if (window.__TAURI__?.event) {
        window.__TAURI__.event.listen('harness://status', (event) => {
          const snapshot = event.payload || {};
          if (snapshot.phase === 'failed' && snapshot.message) {
            document.getElementById('message').textContent = snapshot.message;
          }
        });
        // Show the latest failure message immediately.
        window.__TAURI__.core.invoke('harness_status').then((snapshot) => {
          if (snapshot && snapshot.message) {
            document.getElementById('message').textContent = snapshot.message;
          }
        }).catch(() => {});
      }
      document.getElementById('retry').addEventListener('click', () => {
        if (invoke) invoke('harness_restart').catch(console.error);
      });
      document.getElementById('logs').addEventListener('click', () => {
        if (invoke) invoke('open_logs').catch(console.error);
      });
      document.getElementById('quit').addEventListener('click', () => {
        if (window.__TAURI__?.process) {
          window.__TAURI__.process.exit(0);
        } else if (invoke) {
          invoke('app_quit').catch(console.error);
        }
      });
    </script>
  </body>
</html>
