<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed; inset: 0;
        display: grid; align-content: center; justify-items: center;
        gap: 12px; padding: 32px; text-align: center;
      }
      .markFrame { display: grid; place-items: center; }
      .mark { grid-area: 1 / 1; width: 196px; height: auto; image-rendering: pixelated; }
      .markDark { display: none; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; max-width: 480px; }
      :root[data-theme='dark'] { color-scheme: dark; }
      :root[data-theme='dark'] body { color: #f3f4f6; background: #141416; }
      :root[data-theme='dark'] .markLight { display: none; }
      :root[data-theme='dark'] .markDark { display: block; }
      :root[data-theme='dark'] .status { color: #9ca0a8; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #141416; }
        :root:not([data-theme]) .markLight { display: none; }
        :root:not([data-theme]) .markDark { display: block; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true">
        <img class="mark markLight" src="assets/dsh-loader.gif" alt="" />
        <img class="mark markDark" src="assets/dsh-loader-dark.gif" alt="" />
      </div>
      <h1 class="title" id="title">Starting DSH Desktop</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      const zh = navigator.language.toLowerCase().startsWith('zh');
      const title = document.getElementById('title');
      const status = document.getElementById('status');
      if (zh) {
        title.textContent = '正在启动 DSH Desktop';
        status.textContent = '首次启动可能需要一点时间。';
      }
      // Follow Harness runtime status; Rust navigates away on ready/failed.
      if (window.__TAURI__ && window.__TAURI__.event) {
        window.__TAURI__.event.listen('harness://status', (event) => {
          const snapshot = event.payload || {};
          if (snapshot.message) status.textContent = snapshot.message;
        });
      }
    </script>
  </body>
</html>
