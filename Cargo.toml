# DSH Desktop — Cargo workspace (阶段 0 任务 0.1)
#
# 四个成员：
#   crates/dsh-contracts  通用契约库（常量 / 错误码 / IPC 封套 / JSON-RPC 类型）
#   crates/dsh-host       无 GUI 依赖的宿主库（进程 / 就绪 / token / 路径 / env / 日志 / 诊断导出）
#   crates/dsh-host-cli   命令行排障入口（start / stop / status / tail / doctor）
#   src-tauri             Tauri 2 应用壳（只做窗口、事件、IPC 接线）
#
# 依赖版本在 [workspace.dependencies] 统一收敛，成员 crate 用 `workspace = true`
# 引用，避免同一依赖在三个 crate 里漂移成多个版本。
#
# 已退出 workspace（2026-09-10，批次 F「冻结并归档」的裁定）：
#   crates/dsh-model-gateway — 多厂商工具调用方言网关。无任何运行时消费者，已
#   连同设计文档一起归档（见 docs/archive/model_gateway_design.md 顶部的归档说明）。
#   不要因为「代码写得不错」把它加回来：不在 workspace 里的 crate 既不会被编译
#   也不会被测试，留着就是会腐烂的死重量。

[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/dsh-contracts",
  "crates/dsh-host",
  "crates/dsh-host-cli",
]

[workspace.package]
version = "0.2.0"
authors = ["DataElement"]
edition = "2021"
license = "MIT"
# 下界 1.85：传递依赖 `idna_adapter`（`url` → edition 2024）要求 Rust ≥ 1.85，
# 低于该版本会报 `feature edition2024 is required` 而非可读的 MSRV 提示。
rust-version = "1.85"

[workspace.dependencies]
# 本地 crate
dsh-contracts = { path = "crates/dsh-contracts" }
dsh-host = { path = "crates/dsh-host" }

# 通用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
# `tauri-plugin-log` 的日志门面。显式声明而非借助插件的 `pub use log`
# 重导出，避免把「用日志」这件事耦合到某个插件的重导出路径上。
log = "0.4"
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "process",
  "io-util",
  "net",
  "sync",
  "fs",
  "signal",
] }

# Tauri 与插件（仅 src-tauri 使用，版本在此统一）
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# updater 的默认 `rustls-tls` 后端会拉入 `ring`（C 源码，编译需要 gcc/clang）。
# 本机（见 .cargo/config.toml）刻意不装 C 工具链——纯 Rust 依赖树才能构建。
# 改用 `native-tls`：Windows 上即 schannel（系统证书库，桌面应用更贴切），
# 全链路零 C 依赖。若目标产物必须保留 rustls/ring，则需先安装 C 编译器。
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"

# 平台
libc = "0.2"
winreg = "0.55"
win32job = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
